<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="南機場壘球隊">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#122744">
<title>南機場壘球隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#EEF1F6;
    --header1:#122744;
    --header2:#1E4A78;
    --card:#FFFFFF;
    --ink:#16223A;
    --muted:#77839C;
    --line:#E7EAF1;
    --accent:#F2801E;
    --accent-soft:#FDECD9;
    --good:#1FA968;
    --bad:#E5484D;
    --warn:#D98B00;
    --chip:#F2F4F8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    touch-action:manipulation;
    overscroll-behavior-y:contain;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea, select{
    -webkit-user-select:text;
    user-select:text;
    touch-action:manipulation;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:100px;
  }

  header.top{
    background:linear-gradient(135deg, var(--header1), var(--header2));
    color:#fff;
    padding:22px 20px 26px;
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .team-name{font-weight:900;font-size:22px;letter-spacing:.01em;}
  .team-sub{font-size:12.5px;color:#B9CBE0;margin-top:4px;}

  .stat-band{
    display:flex;
    background:var(--card);
    margin:0 16px;
    margin-top:-18px;
    border-radius:14px;
    box-shadow:0 6px 18px rgba(18,39,68,.12);
    overflow:hidden;
    position:relative;
    z-index:2;
  }
  .stat-band .col{flex:1;text-align:center;padding:14px 6px;}
  .stat-band .col + .col{border-left:1px solid var(--line);}
  .stat-band .lbl{font-size:11px;color:var(--muted);}
  .stat-band .val{font-size:17px;font-weight:900;margin-top:4px;}

  main{padding:26px 16px 8px;}
  section{margin-bottom:20px;}
  .section-title{font-size:15px;font-weight:900;margin:0 0 10px 2px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section-head a{font-size:12px;color:var(--header2);text-decoration:none;font-weight:700;}

  .card{
    background:var(--card);
    border-radius:14px;
    padding:16px;
    box-shadow:0 1px 4px rgba(18,39,68,.05);
  }

  .empty-state{padding:20px 4px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;}
  .empty-state b{display:block;color:var(--ink);font-size:14px;font-weight:700;margin-bottom:3px;}

  .next-title{font-size:11px;color:var(--muted);font-weight:700;}
  .next-main{font-size:16px;font-weight:900;margin-top:4px;}
  .next-sub{font-size:12px;color:var(--muted);margin-top:3px;}

  .quick-list .quick-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .quick-list .quick-item:last-child{border-bottom:none;}
  .quick-item .t{font-size:14.5px;font-weight:700;}
  .quick-item .d{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .quick-item .arrow{color:var(--muted);font-size:16px;}

  .my-stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .my-stat-head .who{font-size:16px;font-weight:900;}
  .my-stat-head select{
    border:1px solid var(--line);background:var(--chip);border-radius:8px;
    padding:7px 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);
  }
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-box{background:var(--chip);border-radius:10px;padding:12px 8px;text-align:center;}
  .stat-box .lbl{font-size:11px;color:var(--muted);}
  .stat-box .val{font-size:17px;font-weight:900;margin-top:4px;}

  /* standings */
  .team-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
  .team-row:last-child{border-bottom:none;}
  .team-row.me{background:var(--accent-soft);margin:0 -16px;padding:11px 16px;border-radius:0;}
  .badge{
    width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:900;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .team-row .rk{font-size:11px;color:var(--muted);width:16px;flex-shrink:0;text-align:center;}
  .team-row .tname{flex:1;font-size:13.5px;font-weight:700;min-width:0;}
  .team-row .tname small{display:block;font-size:10.5px;color:var(--accent);font-weight:700;}
  .team-row .cols{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-shrink:0;}
  .team-row .cols b{color:var(--ink);}
  .table-head{display:flex;gap:0;padding:0 0 8px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--muted);}

  .stage-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;}
  .stage-pill{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 14px;border-radius:100px;background:var(--chip);color:var(--muted);white-space:nowrap;}

  /* leaderboard */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--chip);padding:4px;border-radius:10px;}
  .subtabs button{flex:1;border:none;background:transparent;padding:9px 0;font-size:12.5px;font-weight:700;font-family:'Noto Sans TC',sans-serif;color:var(--muted);border-radius:7px;cursor:pointer;}
  .subtabs button.active{background:var(--header1);color:#fff;}

  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row .name{flex:1;min-width:0;}
  .rank-row .name .n{font-size:14px;font-weight:700;}
  .rank-row .name .t{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px;}
  .rank-row .v{font-size:19px;font-weight:900;}

  /* schedule */
  .form-row{margin-bottom:10px;}
  .form-row label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;}
  .form-row input, .form-row select{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;
    padding:11px 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);
  }
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-primary{
    display:block;width:100%;text-align:center;background:var(--accent);color:#fff;border:none;
    padding:13px;border-radius:10px;font-size:14.5px;font-weight:800;font-family:'Noto Sans TC',sans-serif;
    cursor:pointer;margin-top:4px;
  }
  .btn-outline{
    display:block;width:100%;text-align:center;background:transparent;color:var(--header2);
    border:1.5px solid var(--header2);padding:11px;border-radius:10px;font-size:13.5px;font-weight:700;
    font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-top:10px;
  }
  .btn-ghost-sm{
    background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;
    color:var(--header2);font-weight:700;cursor:pointer;
  }

  .sched-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .sched-item:last-child{border-bottom:none;}
  .sched-tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;flex-shrink:0;}
  .sched-tag.league{background:#E4ECFB;color:#2451B8;}
  .sched-tag.cup{background:var(--accent-soft);color:var(--accent);}
  .sched-item .matchup{flex:1;font-size:13.5px;font-weight:700;min-width:0;}
  .sched-item .meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .sched-item .rm{color:var(--bad);font-size:12px;font-weight:700;background:none;border:none;cursor:pointer;flex-shrink:0;}

  /* roster */
  .roster-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .roster-row:last-child{border-bottom:none;}
  .roster-row.inactive{opacity:.5;}
  .roster-row .jn{font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:13px;color:var(--header2);background:var(--chip);border-radius:7px;min-width:30px;text-align:center;padding:5px 0;flex-shrink:0;}
  .roster-row .rinfo{flex:1;min-width:0;}
  .roster-row .rname{font-size:13.5px;font-weight:700;}
  .roster-row .rjersey{font-weight:400;color:var(--muted);font-size:12px;}
  .roster-row .rmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .status-tag{font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:2px 7px;flex-shrink:0;white-space:nowrap;}
  .roster-chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:100px;padding:6px 12px 6px 6px;font-size:12px;margin:0 6px 6px 0;}
  .roster-chip .av{width:20px;height:20px;border-radius:50%;background:var(--header2);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}

  /* game record */
  .score-hero{text-align:center;}
  .score-hero .vs{font-size:13px;color:var(--muted);}
  .score-hero .sc{font-size:32px;font-weight:900;margin:6px 0;}
  .score-hero .inn{font-size:12px;color:var(--muted);}
  .bases-mini{position:relative;width:64px;height:64px;margin:6px auto 4px;}
  .bases-mini .b-dot{position:absolute;width:20px;height:20px;border:2px solid var(--header2);background:#fff;transform:rotate(45deg);}
  .bases-mini .b-dot.on{background:var(--accent);border-color:var(--accent);}
  .bases-mini .b1{right:0;bottom:10px;}
  .bases-mini .b2{left:22px;top:0;}
  .bases-mini .b3{left:0;bottom:10px;}
  .bases-label{font-size:10px;color:var(--muted);text-align:center;margin-bottom:8px;}
  .linescore{width:100%;border-collapse:collapse;font-size:11.5px;}
  .linescore th,.linescore td{padding:5px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  .linescore th{color:var(--muted);font-weight:600;}
  .linescore td:first-child,.linescore th:first-child{text-align:left;font-weight:700;padding-left:2px;}
  .linescore tr.live-row td:first-child{color:var(--accent);}
  .panel-disabled{opacity:.4;pointer-events:none;}

  .field-wrap{position:relative;width:100%;max-width:300px;margin:6px auto 0;aspect-ratio:300/320;border-radius:12px;overflow:hidden;}
  .field-wrap svg{width:100%;height:100%;display:block;}
  .pos-badge{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:9px;padding:5px 9px;text-align:center;box-shadow:0 2px 6px rgba(18,39,68,.18);min-width:60px;}
  .pos-badge .pk{font-size:9.5px;font-weight:800;color:var(--header2);}
  .pos-badge .pn{font-size:11.5px;font-weight:700;color:var(--ink);margin-top:1px;white-space:nowrap;}
  .pos-badge.rover .pk{color:var(--accent);}

  .order-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .order-row:last-child{border-bottom:none;}
  .order-row .ord-no{font-weight:900;font-size:12.5px;color:#fff;background:var(--header2);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .order-row select{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;background:var(--card);color:var(--ink);}

  .guest-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
  .guest-row:last-child{border-bottom:none;}
  .guest-row .g-no{font-size:12px;color:var(--muted);width:16px;flex-shrink:0;font-weight:700;}
  .guest-row .g-name{flex:1;font-size:13.5px;font-weight:700;}
  .guest-row .g-actions{display:flex;gap:4px;flex-shrink:0;}
  .g-actions button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:12px;color:var(--header2);cursor:pointer;}
  .g-actions button.danger{color:var(--bad);border-color:var(--bad);}
  .guest-add-row{display:flex;gap:8px;margin-top:10px;}
  .guest-add-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Noto Sans TC',sans-serif;}
  .guest-add-row button{background:var(--header1);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:13px;font-weight:700;}

  .pitch-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .pitch-row:last-child{border-bottom:none;}
  .pitch-row .num{font-weight:800;color:var(--muted);}

  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .setting-row:last-child{border-bottom:none;}
  .setting-row .sub{font-size:11px;color:var(--muted);margin-top:2px;}

  nav.bottom{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;
    background:#fff;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:20;box-shadow:0 -2px 12px rgba(18,39,68,.08);
  }
  nav.bottom button{flex:1;background:none;border:none;color:#9AA6BB;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:'Noto Sans TC',sans-serif;padding:6px 0;cursor:pointer;}
  nav.bottom button.active{color:var(--header2);font-weight:700;}
  nav.bottom .icon{font-size:17px;}

  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:100px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:30;white-space:nowrap;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="shell">
  <header class="top">
    <div class="team-name">南機場壘球隊</div>
    <div class="team-sub">2026 賽季 · 好樣聯盟</div>
  </header>
  <div class="stat-band" id="statBand"></div>

  <main id="app"></main>
  <div class="toast" id="toast"></div>

  <nav class="bottom" id="bottomNav">
    <button data-view="home" class="active"><span class="icon">⌂</span>首頁</button>
    <button data-view="stats"><span class="icon">▤</span>戰績</button>
    <button data-view="schedule"><span class="icon">▦</span>賽程</button>
    <button data-view="roster"><span class="icon">♟</span>球員</button>
    <button data-view="settings"><span class="icon">⚙</span>賽季</button>
  </nav>
</div>

<script>
/* ---------- 雲端同步(選填)----------
   要讓全隊看到同一份、跨裝置同步,去 supabase.com 建一個免費專案,
   在 SQL Editor 貼上下面這段建表,再把 Project URL 和 anon public key
   填進 SYNC_URL / SYNC_KEY,重新整理就會自動連上、多人共用。
   沒填的話 App 完全正常運作,只是資料只存在這台裝置,也不需要登入。

   create table team_state (
     id text primary key,
     data jsonb,
     updated_at timestamptz default now()
   );
   alter table team_state enable row level security;
   create policy "public read/write" on team_state for all using (true) with check (true);

   create table profiles (
     id uuid primary key references auth.users(id) on delete cascade,
     name text,
     role text default 'member',
     player_name text,
     created_at timestamptz default now()
   );
   alter table profiles enable row level security;
   create policy "read all profiles" on profiles for select using (true);
   create policy "insert own profile" on profiles for insert with check (auth.uid() = id);
   create policy "update own profile" on profiles for update using (auth.uid() = id);
   create policy "admins can update any profile" on profiles for update using (
     exists (select 1 from profiles p where p.id = auth.uid() and p.role = 'admin')
   );

   Supabase 的 Authentication 設定裡,建議把 Email 驗證(Confirm email)
   關掉,不然每個隊員註冊完都要先去信箱點確認信才能登入,對球隊用途來說
   比較麻煩。位置在 Authentication -> Providers -> Email -> Confirm email。
------------------------------------------------ */
const SYNC_URL = "https://pxqnltrddisszrplzwrr.supabase.co";
const SYNC_KEY = "sb_publishable_sdxUKboRLSF00TxU3v_QVw_qqZMP5Zt";
const SYNC_ROW_ID = "nanjichang-softball";
let sb = null;
let syncEnabled = false;
let saveTimer = null;

function snapshotState(){
  return { standings, roster, schedule, guestPlayers, cupInfo, cupParticipants,
    cupBattingOrder, cupFieldAssignment, battingOrder, fieldAssignment,
    battingStats, pitchingStats, leagueName, gameHistory, totalGames };
}
function applyCloudData(d){
  if(!d) return;
  if(d.standings){ standings.length=0; standings.push(...d.standings); }
  if(d.roster){ roster.length=0; roster.push(...d.roster); }
  if(d.schedule){ schedule.length=0; schedule.push(...d.schedule); }
  if(d.guestPlayers){ guestPlayers.length=0; guestPlayers.push(...d.guestPlayers); }
  if('cupInfo' in d) cupInfo = d.cupInfo;
  if(d.cupParticipants){ cupParticipants.length=0; cupParticipants.push(...d.cupParticipants); }
  if(d.cupBattingOrder){ cupBattingOrder.length=0; cupBattingOrder.push(...d.cupBattingOrder); }
  if(d.cupFieldAssignment) Object.assign(cupFieldAssignment, d.cupFieldAssignment);
  if(d.battingOrder){ battingOrder.length=0; battingOrder.push(...d.battingOrder); }
  if(d.fieldAssignment) Object.assign(fieldAssignment, d.fieldAssignment);
  if(d.battingStats) Object.assign(battingStats, d.battingStats);
  if(d.pitchingStats) Object.assign(pitchingStats, d.pitchingStats);
  if(d.leagueName) leagueName = d.leagueName;
  if(d.totalGames) totalGames = d.totalGames;
  if(d.gameHistory){ gameHistory.length=0; gameHistory.push(...d.gameHistory); }
}
async function cloudLoad(){
  try{
    const { data, error } = await sb.from('team_state').select('data').eq('id', SYNC_ROW_ID).maybeSingle();
    if(!error && data) applyCloudData(data.data);
  }catch(e){ console.warn('雲端讀取失敗', e); }
}
async function doCloudSave(){
  try{ await sb.from('team_state').upsert({ id: SYNC_ROW_ID, data: snapshotState(), updated_at: new Date().toISOString() }); }
  catch(e){ console.warn('雲端儲存失敗', e); }
}
function scheduleCloudSave(){
  if(!syncEnabled) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doCloudSave, 400);
}
function flushCloudSaveNow(){
  if(!syncEnabled) return;
  clearTimeout(saveTimer);
  doCloudSave();
}
function initSync(){
  if(!SYNC_URL || !SYNC_KEY || typeof supabase==='undefined') return;
  sb = supabase.createClient(SYNC_URL, SYNC_KEY);
  syncEnabled = true;
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushCloudSaveNow(); });
  window.addEventListener('pagehide', flushCloudSaveNow);
  sb.channel('team-state-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'team_state', filter:`id=eq.${SYNC_ROW_ID}`}, payload=>{
      if(payload.new && payload.new.data){ applyCloudData(payload.new.data); render(); }
    })
    .subscribe();
}

/* ---------- 帳號 / 權限 ---------- */
let session = null;
let currentProfile = null;   // {id, name, role}
let allProfiles = [];        // 所有已註冊隊員(管理者查看用)
let authView = 'login';      // 'login' | 'signup'
let authError = '';
let authBusy = false;

function isAdmin(){ return !!(currentProfile && currentProfile.role === 'admin'); }
function isLoggedIn(){ return !syncEnabled || !!session; } // 沒接雲端同步就不需要登入,單機模式照舊

async function loadProfile(){
  if(!session) { currentProfile = null; return; }
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(data){ currentProfile = data; }
  else {
    // 這個帳號登入成功了但還沒有 profile(通常是註冊時信箱還沒驗證,建立身分那步被擋下來)
    // 現在已經是登入狀態,補建一筆:第一個補建的人自動當管理者
    const { count } = await sb.from('profiles').select('*', {count:'exact', head:true});
    const role = (count===0) ? 'admin' : 'member';

/* ---------- 計分引擎(打擊/投手紀錄) ---------- */
// battingStats[name] = {AB,H,BB,R,HR}   pitchingStats[name] = {outs,K,BB,H,R,ER,W}
let battingStats = {};
let pitchingStats = {};
function statOf(store, name){
  if(!store[name]) store[name] = {AB:0,H:0,BB:0,R:0,HR:0,outs:0,K:0,ER:0,W:0};
  return store[name];
}
function avgOf(name){
  const s = battingStats[name];
  if(!s || !s.AB) return '.000';
  return (s.H/s.AB).toFixed(3).replace(/^0/,'');
}
function ipOf(name){
  const s = pitchingStats[name];
  if(!s) return '0.0';
  return `${Math.floor(s.outs/3)}.${s.outs%3}`;
}
function eraOf(name){
  const s = pitchingStats[name];
  if(!s || !s.outs) return '0.00';
  const innings = s.outs/3;
  return (s.ER/innings*7).toFixed(2); // 七局制簡易換算,可自行調整
}

function newLiveState(opp, battingFirst, scheduleIdx){
  return {
    id: 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    opp: opp||'對手',
    battingFirst,            // 'us' 先攻 / 'them' 我隊後攻(對方先攻)
    half: battingFirst,      // 目前是誰在打擊
    inning: 1,
    outs: 0,
    batterPtr: 0,
    us: 0, them: 0,
    bases: {1:false,2:false,3:false}, // 目前打擊方的壘上跑者
    innings: [],             // [{us:null|num, them:null|num}, ...] 每局比分
    scheduleIdx,
    log: []
  };
}
let liveGame = { lg:null, cup:null };  // 進行中比賽狀態,依 ns 分開
let scoringPitcher = { lg:'', cup:'' }; // 記錄用的投手,可跟打序裡的 P 不同(換投用)
let pendingBatFirst = { lg:'us', cup:'us' };
let gameHistory = []; // 每一場結束後的完整紀錄(逐局比分+打擊/投手box score)

function computeGameBoxScore(g){
  const bat = {}, pitch = {};
  g.log.forEach(entry=>{
    if(entry.store==='bat'){
      const bs = statOf(bat, entry.name); const t = entry.type;
      if(t==='1B'||t==='2B'||t==='3B'){ bs.AB++; bs.H++; }
      else if(t==='HR'){ bs.AB++; bs.H++; bs.HR++; bs.R++; }
      else if(t==='BB'){ bs.BB++; }
      else if(t==='OUT'){ bs.AB++; }
    } else if(entry.store==='pitch'){
      const ps = statOf(pitch, entry.name); const t = entry.type;
      if(t==='OUT') ps.outs++;
      else if(t==='K'){ ps.K++; ps.outs++; }
      else if(t==='H') ps.H++;
      else if(t==='BB') ps.BB++;
      else if(t==='R') ps.R++;
      else if(t==='ER') ps.ER++;
      else if(t==='W') ps.W++;
    }
  });
  return {bat, pitch};
}

function orderArrOf(ns){ return ns==='cup' ? cupBattingOrder : battingOrder; }
function lineupPitcher(ns){
  const row = orderArrOf(ns).find(r=>r.pos==='P');
  return row ? row.player : '';
}
function activePitcher(ns){ return scoringPitcher[ns] || lineupPitcher(ns); }

function ensureInningRow(g, idx){
  while(g.innings.length <= idx) g.innings.push({us:null, them:null});
}
function switchHalfIfNeeded(g){
  if(g.outs < 3) return;
  const idx = g.inning - 1;
  ensureInningRow(g, idx);
  if(g.innings[idx][g.half] == null) g.innings[idx][g.half] = 0;
  g.outs = 0;
  g.bases = {1:false,2:false,3:false};
  if(g.half === g.battingFirst){
    g.half = (g.battingFirst==='us') ? 'them' : 'us';
  } else {
    g.half = g.battingFirst;
    g.inning++;
  }
}

// 簡化版跑壘規則:安打/全壘打時,場上跑者跟打者一起前進同樣的壘數
function advanceRunners(g, n){
  let runs = 0;
  const old = {...g.bases};
  g.bases = {1:false,2:false,3:false};
  [1,2,3].forEach(b=>{
    if(old[b]){
      const dest = b + n;
      if(dest >= 4) runs++; else g.bases[dest] = true;
    }
  });
  if(n < 4) g.bases[n] = true; else runs++; // n=4 是全壘打,打者也回本壘
  return runs;
}
// 保送/四壞:只有被逼進壘的跑者才會前進
function forceWalk(g){
  let runs = 0;
  if(g.bases[1]){
    if(g.bases[2]){
      if(g.bases[3]) runs++;
      g.bases[3] = true;
    } else {
      g.bases[2] = true;
    }
  }
  g.bases[1] = true;
  return runs;
}

function recordBat(ns, type){
  const g = liveGame[ns];
  if(!g){ toast('請先開始比賽'); return; }
  if(g.half!=='us'){ toast('現在是對方打擊,先記錄投手那邊'); return; }
  const order = orderArrOf(ns).filter(r=>r.player);
  if(!order.length){ toast('請先在打序中選擇球員'); return; }
  const batter = order[g.batterPtr % order.length].player;
  const bs = statOf(battingStats, batter);
  const prevStat = {...bs};
  const prevGame = {...g, innings: g.innings.map(r=>({...r})), bases: {...g.bases}};
  if(type==='1B'||type==='2B'||type==='3B'){
    const n = type==='1B'?1:type==='2B'?2:3;
    bs.AB++; bs.H++;
    const runs = advanceRunners(g, n);
    if(runs){ g.us += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].us = (g.innings[g.inning-1].us||0) + runs; }
  }
  else if(type==='HR'){
    bs.AB++; bs.H++; bs.HR++; bs.R++;
    const runs = advanceRunners(g, 4);
    g.us += runs;
    ensureInningRow(g, g.inning-1);
    g.innings[g.inning-1].us = (g.innings[g.inning-1].us||0) + runs;
  }
  else if(type==='BB'){
    bs.BB++;
    const runs = forceWalk(g);
    if(runs){ g.us += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].us = (g.innings[g.inning-1].us||0) + runs; }
  }
  else if(type==='OUT'){ bs.AB++; g.outs++; }
  g.batterPtr++;
  switchHalfIfNeeded(g);
  g.log.push({store:'bat', name:batter, type, prevStat, prevGame});
  render();
}
function recordPitch(ns, type){
  const g = liveGame[ns];
  if(!g){ toast('請先開始比賽'); return; }
  if(g.half==='us'){ toast('現在我隊在打擊,先記錄打者那邊'); return; }
  const pitcher = activePitcher(ns);
  if(!pitcher){ toast('請先在打序中指定投手,或用下拉選單選投手'); return; }
  const ps = statOf(pitchingStats, pitcher);
  const prevStat = {...ps};
  const prevGame = {...g, innings: g.innings.map(r=>({...r})), bases: {...g.bases}};
  if(type==='OUT'){ ps.outs++; g.outs++; }
  else if(type==='K'){ ps.K++; ps.outs++; g.outs++; }
  else if(type==='H'){
    ps.H++;
    const runs = advanceRunners(g, 1);
    if(runs){ g.them += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + runs; }
  }
  else if(type==='BB'){
    ps.BB++;
    const runs = forceWalk(g);
    if(runs){ g.them += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + runs; }
  }
  else if(type==='R'){
    ps.R++; g.them++;
    ensureInningRow(g, g.inning-1);
    g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + 1;
  }
  else if(type==='ER') ps.ER++;
  else if(type==='W') ps.W++;
  switchHalfIfNeeded(g);
  g.log.push({store:'pitch', name:pitcher, type, prevStat, prevGame});
  render();
}
function recordOppRun(ns){
  const g = liveGame[ns];
  if(!g){ toast('請先開始比賽'); return; }
  const prevGame = {...g, innings: g.innings.map(r=>({...r})), bases: {...g.bases}};
  g.them++;
  ensureInningRow(g, g.inning-1);
  g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + 1;
  g.log.push({store:null, type:'OPPRUN', prevGame});
  render();
}
function undoLast(ns){
  const g = liveGame[ns];
  if(!g || !g.log.length){ toast('沒有可以復原的紀錄'); return; }
  const last = g.log.pop();
  if(last.store==='bat') battingStats[last.name] = last.prevStat;
  if(last.store==='pitch') pitchingStats[last.name] = last.prevStat;
  Object.assign(g, last.prevGame);
  render();
}
function updateStandingsFromResult(us, them){
  const me = standings.find(r=>r.me);
  if(!me) return;
  if(us > them) me.w++;
  else if(us < them) me.l++;
  else me.t++;
  const g = me.w + me.l + me.t;
  me.pct = g ? (me.w/g).toFixed(3).replace(/^0/,'') : '.000';
  standings.sort((a,b)=> (b.w-b.l) - (a.w-a.l));
  standings.forEach((r,i)=> r.rank = i+1);
}

function endGame(ns){
  const g = liveGame[ns];
  if(!g) return;
  const idx = g.inning - 1;
  ensureInningRow(g, idx);
  if(g.innings[idx][g.half] == null) g.innings[idx][g.half] = 0;
  const opp = g.opp;
  const finalUs = g.us, finalThem = g.them;
  const box = computeGameBoxScore(g);
  const sched = (g.scheduleIdx!=null) ? schedule[g.scheduleIdx] : null;
  const gameType = sched ? sched.type : (ns==='cup'?'盃賽':'聯賽');
  const record = {
    id: g.id, ns, opp, us: finalUs, them: finalThem, innings: g.innings,
    date: sched?sched.date:'', time: sched?sched.time:'', type: gameType,
    box
  };
  gameHistory.push(record);
  if(sched){ sched.result = `${finalUs}:${finalThem}`; sched.historyId = g.id; }
  if(gameType === '聯賽') updateStandingsFromResult(finalUs, finalThem);
  toast(`比賽結束:南機場 ${finalUs} : ${finalThem} ${opp}`);
  liveGame[ns] = null;
  render();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function emptyState(title, sub){
  return `<div class="empty-state"><b>${title}</b>${sub?sub:''}</div>`;
}

function renderStatBand(){
  const me = standings.find(s=>s.me);
  document.getElementById('statBand').innerHTML = `

    <div class="col"><div class="lbl">聯賽排名</div><div class="val">#${me.rank}</div></div>

}

function render(){
  if(!isLoggedIn()){
    app.innerHTML = viewAuth();
    document.getElementById('statBand').innerHTML = '';
    document.getElementById('bottomNav').style.display = 'none';
    bindDynamicHandlers();
    return;
  }
  document.getElementById('bottomNav').style.display = '';
  if(currentView==='home') app.innerHTML = viewHome();
  if(currentView==='stats') app.innerHTML = viewStats();
  if(currentView==='schedule') app.innerHTML = viewSchedule();
  if(currentView==='roster') app.innerHTML = viewRoster();
  if(currentView==='record') app.innerHTML = viewRecord();
  if(currentView==='gameDetail') app.innerHTML = viewGameDetail();
  if(currentView==='settings') app.innerHTML = viewSettings();
  renderStatBand();
  bindDynamicHandlers();
  scheduleCloudSave();
}

function computeLeaderboard(kind){
  if(kind==='avg' || kind==='hits'){
    return Object.keys(battingStats)
      .filter(n=>battingStats[n].AB>0)
      .map(n=>({name:n, team:'南機場', ab:battingStats[n].AB, h:battingStats[n].H}))
      .sort((a,b)=> kind==='avg' ? (b.h/b.ab)-(a.h/a.ab) : b.h-a.h)
      .map(r=> ({name:r.name, team:r.team, val: kind==='avg' ? (r.h/r.ab).toFixed(3).replace(/^0/,'') : String(r.h), color:'#F2801E'}));
  }
  return Object.keys(pitchingStats)
    .filter(n=>pitchingStats[n].outs>0 || pitchingStats[n].W>0)
    .map(n=>({name:n, team:'南機場', w:pitchingStats[n].W, era:parseFloat(eraOf(n))}))
    .sort((a,b)=> kind==='wins' ? b.w-a.w : a.era-b.era)
    .map(r=> ({name:r.name, team:r.team, val: kind==='wins' ? String(r.w) : r.era.toFixed(2), color:'#2F6FED'}));
}

function knownOpponents(){
  const fromStandings = standings.filter(s=>!s.me).map(s=>s.team);
  const fromSchedule = schedule.map(s=>s.opp);
  return [...new Set([...fromStandings, ...fromSchedule])].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
}
function knownPlaces(){
  return [...new Set(schedule.map(s=>s.place).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
}

    <div class="form-2col">
      <div class="form-row"><label>失分</label><input id="editPR" value="${ps.R}" inputmode="numeric" /></div>
      <div class="form-row"><label>自責分</label><input id="editER" value="${ps.ER}" inputmode="numeric" /></div>
    </div>
    <div class="form-row"><label>勝投</label><input id="editW" value="${ps.W}" inputmode="numeric" /></div>

      <button class="btn-outline" style="flex:1;" data-action="cancelEditPlayer">取消</button>
    </div>
  </div>`;
}

function usedPlayers(orderArr, excludeIdx){ return orderArr.filter((r,i)=>i!==excludeIdx && r.player).map(r=>r.player); }
function usedPositions(orderArr, excludeIdx){ return orderArr.filter((r,i)=>i!==excludeIdx && r.pos).map(r=>r.pos); }

function playerOptions(selected, pool, exclude){
  const ex = exclude||[];
  return `<option value="">— 選擇球員 —</option>` +
    pool.filter(name=> name===selected || !ex.includes(name))
        .map(name=>`<option value="${name}" ${selected===name?'selected':''}>${name}</option>`).join('');
}
function posOptions(selected, exclude){
  const ex = exclude||[];
  return `<option value="">— 守位 —</option>` +
    fieldPositions.filter(p=> p.key===selected || !ex.includes(p.key))
        .map(p=>`<option value="${p.key}" ${selected===p.key?'selected':''}>${p.label}</option>`).join('');
}

function renderBattingOrder(orderArr, pool, ns){
  const filled = orderArr.filter(r=>r.player).length;
  const expanded = lineupExpanded[ns];
  return `
    <div class="section-head" style="margin-bottom:${expanded?'10px':'0'};">
      <span style="font-size:12px;color:var(--muted);">已排 ${filled} / ${orderArr.length} 棒</span>
      <a data-action="toggleLineup" data-ns="${ns}">${expanded?'收起 ▲':'展開 ▼'}</a>
    </div>
    ${expanded ? `
      ${orderArr.map((row,i)=>`
        <div class="order-row">
          <div class="ord-no">${i+1}</div>
          <select data-order-ns="${ns}" data-order-idx="${i}" data-order-field="player" style="flex:1.3;">${playerOptions(row.player, pool, usedPlayers(orderArr,i))}</select>
          <select data-order-ns="${ns}" data-order-idx="${i}" data-order-field="pos" style="flex:1;">${posOptions(row.pos, usedPositions(orderArr,i))}</select>
        </div>`).join('')}
      <button class="btn-outline" data-action="addBatter" data-ns="${ns}">+ 新增打者</button>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;">每一列同時選「打者」和「守位」,同一個人、同一個守位不會出現在別列的選單裡了,不用擔心選重複。守位可以留空(替補/指定打擊不用守備)。</div>
    ` : ''}
  `;
}

function renderFieldDiagram(orderArr, ns){
  const posMap = {};
  orderArr.forEach(r=>{ if(r.pos) posMap[r.pos] = r.player; });
  return `
    <div class="field-wrap">
      <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="300" height="320" fill="#5CA860"/>
        <polygon points="150,300 265,185 150,70 35,185" fill="#C79A6B"/>
        <polygon points="150,280 225,213 150,145 75,213" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
        <circle cx="150" cy="207" r="9" fill="#EFE3D0" stroke="#fff" stroke-width="2"/>
      </svg>
      ${fieldPositions.map(p=>`
        <div class="pos-badge ${p.rover?'rover':''}" style="left:${(p.x/300*100).toFixed(1)}%;top:${(p.y/320*100).toFixed(1)}%;">
          <div class="pk">${p.rover?'Rover':p.label}</div>
          <div class="pn">${posMap[p.key] || '—'}</div>
        </div>`).join('')}
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;">守備陣型依打序裡每個人選的守位自動排出來,要換人請回去改打序。</div>
  `;
}

let recordNs = 'lg';

let viewingGameId = null;

function renderLineScoreStatic(rec){
  const cols = rec.innings.length;
  return `
    <table class="linescore">
      <tr><th></th>${Array.from({length:cols},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th></tr>
      <tr><td>南機場</td>${rec.innings.map(r=>`<td>${r.us==null?'':r.us}</td>`).join('')}<td><b>${rec.us}</b></td></tr>
      <tr><td>${rec.opp}</td>${rec.innings.map(r=>`<td>${r.them==null?'':r.them}</td>`).join('')}<td><b>${rec.them}</b></td></tr>
    </table>
  `;
}
function renderBoxBatting(bat){
  const names = Object.keys(bat);
  if(!names.length) return emptyState('這場沒有打擊紀錄');
  return `
    <table class="linescore">
      <tr><th style="text-align:left;">打者</th><th>打數</th><th>安打</th><th>全壘打</th><th>保送</th><th>得分</th></tr>
      ${names.map(n=>{const s=bat[n]; return `<tr><td style="text-align:left;">${n}</td><td>${s.AB}</td><td>${s.H}</td><td>${s.HR}</td><td>${s.BB}</td><td>${s.R}</td></tr>`;}).join('')}
    </table>
  `;
}
function renderBoxPitching(pitch){
  const names = Object.keys(pitch);
  if(!names.length) return emptyState('這場沒有投手紀錄');
  return `
    <table class="linescore">
      <tr><th style="text-align:left;">投手</th><th>局數</th><th>被安打</th><th>保送</th><th>三振</th><th>自責分</th><th>勝</th></tr>
      ${names.map(n=>{const s=pitch[n]; return `<tr><td style="text-align:left;">${n}</td><td>${Math.floor(s.outs/3)}.${s.outs%3}</td><td>${s.H}</td><td>${s.BB}</td><td>${s.K}</td><td>${s.ER}</td><td>${s.W}</td></tr>`;}).join('')}

}
function viewGameDetail(){

function renderBasesIndicator(g){
  if(!g) return '';
  return `
    <div class="bases-mini">
      <div class="b-dot b2 ${g.bases[2]?'on':''}"></div>
      <div class="b-dot b3 ${g.bases[3]?'on':''}"></div>
      <div class="b-dot b1 ${g.bases[1]?'on':''}"></div>

  `;

function renderLineScore(g){
  const cols = Math.max(g.inning, g.innings.length);
  const cell = (i, side) => {
    if(g.innings[i] && g.innings[i][side]!=null) return g.innings[i][side];
    if(i===g.inning-1 && g.half===side) return 0; // 這半局進行中還沒得分
    return '';
  };
  return `
    <table class="linescore">
      <tr><th></th>${Array.from({length:cols},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th></tr>
      <tr class="${g.half==='us'?'live-row':''}"><td>南機場</td>${Array.from({length:cols},(_,i)=>`<td>${cell(i,'us')}</td>`).join('')}<td><b>${g.us}</b></td></tr>
      <tr class="${g.half==='them'?'live-row':''}"><td>${g.opp}</td>${Array.from({length:cols},(_,i)=>`<td>${cell(i,'them')}</td>`).join('')}<td><b>${g.them}</b></td></tr>
    </table>
  `;
}

/* ---------- 事件綁定 ---------- */
function bindDynamicHandlers(){
  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentView = el.dataset.nav;
      if(el.dataset.sub) statsSubtab = el.dataset.sub;
      if(el.dataset.recns) recordNs = el.dataset.recns;
      setActiveNav(); render(); window.scrollTo(0,0);
      if(currentView==='settings' && isAdmin() && !allProfiles.length) refreshMembers();
    });
  });
  app.querySelectorAll('[data-statsub]').forEach(el=>{
    el.addEventListener('click', ()=>{ statsSubtab = el.dataset.statsub; render(); });
  });
  app.querySelectorAll('[data-ranktab]').forEach(el=>{
    el.addEventListener('click', ()=>{ rankTab = el.dataset.ranktab; render(); });
  });
  const statSel = document.getElementById('statPlayerSel');
  if(statSel) statSel.addEventListener('change', ()=>{ selectedStatPlayer = statSel.value; render(); });
  const schedOppSel = document.getElementById('schedOppSel');
  if(schedOppSel) schedOppSel.addEventListener('change', ()=>{
    document.getElementById('schedOppNew').style.display = schedOppSel.value==='__new__' ? 'block' : 'none';
  });
  const schedPlaceSel = document.getElementById('schedPlaceSel');
  if(schedPlaceSel) schedPlaceSel.addEventListener('change', ()=>{
    document.getElementById('schedPlaceNew').style.display = schedPlaceSel.value==='__new__' ? 'block' : 'none';
  });

  app.querySelectorAll('[data-order-ns]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const arr = el.dataset.orderNs==='cup' ? cupBattingOrder : battingOrder;
      arr[+el.dataset.orderIdx][el.dataset.orderField] = el.value;
      render();
    });
  });
  const pitcherSel = document.getElementById('pitcherSel');
  if(pitcherSel) pitcherSel.addEventListener('change', ()=>{ scoringPitcher[recordNs] = pitcherSel.value; render(); });
  app.querySelectorAll('[data-cup-pick]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const name = el.dataset.cupPick;
      if(el.checked){ if(!cupParticipants.includes(name)) cupParticipants.push(name); }
      else{ cupParticipants = cupParticipants.filter(n=>n!==name); }
      render();
    });
  });
  app.querySelectorAll('[data-guest-up]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!requireAdmin())return;
      const i = +el.dataset.guestUp;
      [guestPlayers[i-1], guestPlayers[i]] = [guestPlayers[i], guestPlayers[i-1]];
      render();
    });
  });
  app.querySelectorAll('[data-guest-down]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!requireAdmin())return;
      const i = +el.dataset.guestDown;
      [guestPlayers[i+1], guestPlayers[i]] = [guestPlayers[i], guestPlayers[i+1]];
      render();
    });
  });
  app.querySelectorAll('[data-guest-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{ if(!requireAdmin())return; guestPlayers.splice(+el.dataset.guestRemove,1); render(); });
  });
  app.querySelectorAll('[data-sched-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{ if(!requireAdmin())return; schedule.splice(+el.dataset.schedRemove,1); render(); });
  });
  app.querySelectorAll('[data-sched-view]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = schedule[+el.dataset.schedView];
      if(s && s.historyId){ viewingGameId = s.historyId; currentView = 'gameDetail'; setActiveNav(); render(); window.scrollTo(0,0); }
    });
  });
  app.querySelectorAll('[data-rec]').forEach(el=>{
    el.addEventListener('click', ()=>{ recordBat(el.dataset.ns, el.dataset.rec); });
  });
  app.querySelectorAll('[data-pitch]').forEach(el=>{
    el.addEventListener('click', ()=>{ recordPitch(el.dataset.ns, el.dataset.pitch); });
  });
  app.querySelectorAll('[data-batfirst]').forEach(el=>{
    el.addEventListener('click', ()=>{ pendingBatFirst[el.dataset.ns] = el.dataset.batfirst; render(); });
  });
  app.querySelectorAll('[data-edit-player]').forEach(el=>{
    el.addEventListener('click', ()=>{ if(!requireAdmin())return; editingPlayerIdx = +el.dataset.editPlayer; render(); window.scrollTo(0,0); });
  });
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const act = el.dataset.action;
      if(act==='showAddGuest'){ if(!requireAdmin())return; showGuestForm = true; render(); return; }
      if(act==='confirmAddGuest'){
        if(!requireAdmin())return;
        const input = document.getElementById('guestNameInput');
        const name = (input?.value||'').trim();
        if(name){ guestPlayers.push({name}); showGuestForm = false; render(); toast(`已新增外援:${name}`); }
        return;
      }
      if(act==='addBatter'){
        if(el.dataset.ns==='cup') cupBattingOrder.push({player:'',pos:''}); else battingOrder.push({player:'',pos:''});
        render(); return;
      }
      if(act==='toggleLineup'){ lineupExpanded[el.dataset.ns] = !lineupExpanded[el.dataset.ns]; render(); return; }
      if(act==='showCreateCup'){ if(!requireAdmin())return; showCupForm = true; render(); return; }
      if(act==='confirmCreateCup'){
        if(!requireAdmin())return;
        const input = document.getElementById('cupNameInput');
        const name = (input?.value||'').trim();
        if(name){ cupInfo = {name}; showCupForm = false; render(); toast(`已建立盃賽:${name}`); }
        return;
      }
      if(act==='deleteCup'){
        if(!requireAdmin())return;
        cupInfo = null; cupParticipants = []; cupBattingOrder = new Array(10).fill(null).map(()=>({player:'',pos:''})); cupFieldAssignment = {};
        render(); return;
      }
      if(act==='editStandings'){ if(!requireAdmin())return; editingStandings = !editingStandings; render(); return; }
      if(act==='saveStandings'){
        if(!requireAdmin())return;
        standings.forEach(r=>{
          const w = document.getElementById('sw-'+r.team), l = document.getElementById('sl-'+r.team), t = document.getElementById('st-'+r.team);
          if(w) r.w = +w.value||0;
          if(l) r.l = +l.value||0;
          if(t) r.t = +t.value||0;
          const g = r.w+r.l+r.t;
          r.pct = g ? (r.w/g).toFixed(3).replace(/^0/,'') : '.000';
        });
        standings.sort((a,b)=> (b.w-b.l) - (a.w-a.l));
        standings.forEach((r,i)=> r.rank = i+1);
        editingStandings = false; render(); toast('已更新戰績');
        return;
      }
      if(act==='addPlayer'){ if(!requireAdmin())return; showAddPlayerForm = true; render(); return; }
      if(act==='confirmAddPlayer'){
        if(!requireAdmin())return;
        const nm = document.getElementById('newPlayerName')?.value.trim();
        const no = document.getElementById('newPlayerNo')?.value.trim();
        const pos = document.getElementById('newPlayerPos')?.value.trim();
        if(!nm){ toast('請輸入姓名'); return; }
        roster.splice(roster.length-4, 0, {no: no||'-', name: nm, jersey:'', size:'', pos: pos||''});
        showAddPlayerForm = false; render(); toast(`已新增球員:${nm}`);
        return;
      }
      if(act==='saveEditPlayer'){
        if(!requireAdmin())return;
        const idx = +el.dataset.idx;
        const p = roster[idx];
        if(!p){ editingPlayerIdx = null; render(); return; }
        const oldName = p.name;
        const newName = document.getElementById('editName')?.value.trim() || p.name;
        p.name = newName;
        p.no = document.getElementById('editNo')?.value.trim() || p.no;
        p.jersey = document.getElementById('editJersey')?.value.trim() || '';
        p.size = document.getElementById('editSize')?.value.trim() || '';
        p.pos = document.getElementById('editPos')?.value.trim() || '';
        const st = document.getElementById('editStatus')?.value.trim();
        if(st) p.status = st; else delete p.status;
        const num = id => { const v = +document.getElementById(id)?.value; return isNaN(v) ? 0 : v; };
        if(oldName !== newName){ delete battingStats[oldName]; delete pitchingStats[oldName]; }
        battingStats[newName] = { AB:num('editAB'), H:num('editH'), HR:num('editHR'), BB:num('editBBb'), R:num('editBatR'), outs:0, K:0, ER:0, W:0 };
        pitchingStats[newName] = { outs:num('editOuts'), K:num('editK'), H:num('editPH'), BB:num('editPBB'), R:num('editPR'), ER:num('editER'), W:num('editW') };
        editingPlayerIdx = null; render(); toast('已更新球員資料');
        return;
      }
      if(act==='cancelEditPlayer'){ editingPlayerIdx = null; render(); return; }
      if(act==='addSchedule'){
        if(!requireAdmin())return;
        const type = document.getElementById('schedType').value;
        const oppSel = document.getElementById('schedOppSel').value;
        const opp = oppSel==='__new__' ? document.getElementById('schedOppNew').value.trim() : oppSel;
        const date = document.getElementById('schedDate').value;
        const time = document.getElementById('schedTime').value;
        const placeSel = document.getElementById('schedPlaceSel').value;
        const place = placeSel==='__new__' ? document.getElementById('schedPlaceNew').value.trim() : placeSel;
        if(!opp){ toast('請選擇或輸入對手球隊'); return; }
        schedule.push({type, opp, date, time, place});
        sortSchedule();
        render();
        toast('已新增賽程');
        return;
      }
      if(act==='startGame'){
        const ns = el.dataset.ns;
        const selEl = document.getElementById('startGameSel');
        const oppInput = document.getElementById('startOpp');
        let opp, scheduleIdx = null;
        if(selEl && selEl.value!==''){
          scheduleIdx = +selEl.value;
          opp = schedule[scheduleIdx]?.opp;
        }
        if(!opp) opp = (oppInput?.value||'').trim();
        if(!opp){ toast('請選一場比賽或輸入對手球隊'); return; }
        liveGame[ns] = newLiveState(opp, pendingBatFirst[ns], scheduleIdx);
        render(); toast('比賽開始,加油!');
        return;
      }
      if(act==='undo'){ undoLast(el.dataset.ns); return; }
      if(act==='endGame'){ endGame(el.dataset.ns); return; }
      if(act==='oppRun'){ recordOppRun(el.dataset.ns); return; }
      if(act==='saveSettings'){
        if(!requireAdmin())return;
        const league = document.getElementById('settingLeague')?.value.trim();
        const games = +document.getElementById('settingTotalGames')?.value;
        if(league){ leagueName = league; document.querySelector('.team-sub').textContent = `2026 賽季 · ${leagueName}`; }
        if(games) totalGames = games;
        render();
        toast('已儲存賽季設定');
        return;
      }
      if(act==='saveLinkedPlayer'){ saveLinkedPlayer(); return; }
      if(act==='resetStats'){
        if(!requireAdmin())return;
        if(!confirm('確定要把所有球員的打擊/投手數據清空嗎?這個動作沒辦法復原。')) return;
        Object.keys(battingStats).forEach(k=>delete battingStats[k]);
        Object.keys(pitchingStats).forEach(k=>delete pitchingStats[k]);
        render();
        toast('已清空所有打擊/投手數據');
        return;
      }
      if(act==='refreshMembers'){ refreshMembers(); return; }
      if(act==='toggleRole'){ toggleMemberRole(el.dataset.id, el.dataset.role); return; }
      if(act==='addAccount'){ toast('這台裝置僅支援單一本機帳號,多人共用需接上第 6 點的雲端同步'); return; }
      if(act==='logout'){ doLogout(); return; }
      if(act==='doLogin'){ doLogin(); return; }
      if(act==='doSignup'){ doSignup(); return; }
      if(act==='toggleAuthView'){ authView = authView==='login'?'signup':'login'; authError=''; render(); return; }
      toast('架構示意 — 尚未串接功能');
    });
  });
}

function setActiveNav(){
  document.querySelectorAll('#bottomNav button').forEach(b=>{
    b.classList.toggle('active',
      b.dataset.view===currentView ||
      (currentView==='record' && b.dataset.view==='home') ||
      (currentView==='gameDetail' && b.dataset.view==='schedule'));
  });
}

document.getElementById('bottomNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
  window.scrollTo(0,0);
  if(currentView==='settings' && isAdmin() && !allProfiles.length) refreshMembers();
});

initSync();
initAuth();
</script>
</body>
</html>
