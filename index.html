<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="南機場壘球隊">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#122744">
<title>南機場壘球隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#EEF1F6;
    --header1:#122744;
    --header2:#1E4A78;
    --card:#FFFFFF;
    --ink:#16223A;
    --muted:#77839C;
    --line:#E7EAF1;
    --accent:#F2801E;
    --accent-soft:#FDECD9;
    --good:#1FA968;
    --bad:#E5484D;
    --warn:#D98B00;
    --chip:#F2F4F8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    touch-action:manipulation;
    overscroll-behavior-y:contain;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea, select{
    -webkit-user-select:text;
    user-select:text;
    touch-action:manipulation;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:100px;
  }

  header.top{
    background:linear-gradient(135deg, var(--header1), var(--header2));
    color:#fff;
    padding:22px 20px 26px;
    padding-top:calc(22px + env(safe-area-inset-top));
  }
  .team-name{font-weight:900;font-size:22px;letter-spacing:.01em;}
  .team-sub{font-size:12.5px;color:#B9CBE0;margin-top:4px;}

  .stat-band{
    display:flex;
    background:var(--card);
    margin:0 16px;
    margin-top:-18px;
    border-radius:16px;
    box-shadow:0 8px 22px rgba(18,39,68,.14);
    overflow:hidden;
    position:relative;
    z-index:2;
  }
  .stat-band .col{flex:1;text-align:center;padding:14px 6px;position:relative;}
  .stat-band .col + .col{border-left:1px solid var(--line);}
  .stat-band .lbl{font-size:10.5px;color:var(--muted);letter-spacing:.02em;}
  .stat-band .val{font-size:18px;font-weight:900;margin-top:5px;}
  .stat-band .col.rank .val{background:linear-gradient(135deg,var(--accent),#F2A93B);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .winrate-bar{height:4px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden;}
  .winrate-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--header2),var(--accent));border-radius:3px;}
  .form-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:900;color:#fff;flex-shrink:0;}
  .form-dot.w{background:#16A34A;}
  .form-dot.l{background:#DC2626;}
  .form-dot.t{background:#8592A8;}

  main{padding:26px 16px 8px;}
  section{margin-bottom:20px;}
  .section-title{font-size:15px;font-weight:900;margin:0 0 10px 2px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .section-head a{font-size:12px;color:var(--header2);text-decoration:none;font-weight:700;}

  .card{
    background:var(--card);
    border-radius:16px;
    padding:16px;
    box-shadow:0 2px 10px rgba(18,39,68,.06);
    border:1px solid rgba(18,39,68,.03);
  }

  .empty-state{padding:20px 4px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7;}
  .empty-state b{display:block;color:var(--ink);font-size:14px;font-weight:700;margin-bottom:3px;}

  .next-title{font-size:11px;color:var(--muted);font-weight:700;}
  .next-main{font-size:20px;font-weight:900;margin-top:6px;}
  .next-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .next-card{border-left:4px solid var(--accent);}
  .eyebrow{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.03em;}
  .home-divider{height:1px;background:var(--line);margin:12px 0;}

  .quick-list .quick-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .quick-list .quick-item:last-child{border-bottom:none;}
  .quick-item .t{font-size:14.5px;font-weight:700;}
  .quick-item .d{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .quick-item .arrow{color:var(--muted);font-size:16px;}

  .my-stat-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .my-stat-head .who{font-size:16px;font-weight:900;}
  .my-stat-head select{
    border:1px solid var(--line);background:var(--chip);border-radius:8px;
    padding:7px 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);
  }
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stat-box{background:var(--chip);border-radius:12px;padding:12px 8px;text-align:center;}
  .stat-box .lbl{font-size:11px;color:var(--muted);}
  .stat-box .val{font-size:17px;font-weight:900;margin-top:4px;}
  .stat-box.hero{background:linear-gradient(135deg,var(--header1),var(--header2));grid-column:span 3;padding:16px 8px;position:relative;overflow:hidden;}
  .stat-box.hero::after{content:'';position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.08);}
  .stat-box.hero .lbl{color:#B9CBE0;}
  .stat-box.hero .val{font-size:30px;color:#fff;letter-spacing:.01em;}

  /* standings */
  .team-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);border-left:3px solid transparent;padding-left:8px;margin-left:-8px;}
  .team-row:last-child{border-bottom:none;}
  .team-row.me{background:var(--accent-soft);margin:0 -16px;padding:11px 16px;border-radius:0;border-left:3px solid var(--accent);}
  .badge{
    width:28px;height:28px;border-radius:50%;color:#fff;font-size:12px;font-weight:900;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .team-row .rk{font-size:11px;color:var(--muted);width:16px;flex-shrink:0;text-align:center;}
  .team-row .tname{flex:1;font-size:13.5px;font-weight:700;min-width:0;}
  .team-row .tname small{display:block;font-size:10.5px;color:var(--accent);font-weight:700;}
  .team-row .cols{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-shrink:0;}
  .team-row .cols b{color:var(--ink);}
  .table-head{display:flex;gap:0;padding:0 0 8px;border-bottom:1px solid var(--line);font-size:10.5px;color:var(--muted);}

  .stage-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;}
  .stage-pill{flex-shrink:0;font-size:12px;font-weight:700;padding:7px 14px;border-radius:100px;background:var(--chip);color:var(--muted);white-space:nowrap;cursor:pointer;}
  .stage-pill.active{background:var(--accent);color:#fff;}

  /* leaderboard */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;background:var(--chip);padding:4px;border-radius:10px;}
  .subtabs button{flex:1;border:none;background:transparent;padding:9px 0;font-size:12.5px;font-weight:700;font-family:'Noto Sans TC',sans-serif;color:var(--muted);border-radius:7px;cursor:pointer;transition:background .15s;}
  .subtabs button.active{background:linear-gradient(135deg,var(--header1),var(--header2));color:#fff;box-shadow:0 3px 8px rgba(18,39,68,.25);}

  .rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-row .name{flex:1;min-width:0;}
  .rank-row .name .n{font-size:14px;font-weight:700;}
  .rank-row .name .t{font-size:11px;color:var(--accent);font-weight:600;margin-top:2px;}
  .rank-row .v{font-size:19px;font-weight:900;}
  .rank-row.top1,.rank-row.top2,.rank-row.top3{margin:0 -16px;padding:11px 16px;border-radius:10px;}
  .rank-row.top1{background:linear-gradient(90deg,rgba(255,196,54,.14),transparent 80%);}
  .rank-row.top2{background:linear-gradient(90deg,rgba(180,190,204,.16),transparent 80%);}
  .rank-row.top3{background:linear-gradient(90deg,rgba(201,122,61,.13),transparent 80%);}
  .rank-row.top1 .badge{width:32px;height:32px;font-size:14px;background:linear-gradient(135deg,#FFD65C,#F2A93B) !important;color:#7A4B00;box-shadow:0 3px 8px rgba(242,169,59,.45);}
  .rank-row.top2 .badge{width:32px;height:32px;font-size:14px;background:linear-gradient(135deg,#EDEFF3,#B9C2CF) !important;color:#4B5563;box-shadow:0 3px 8px rgba(140,150,165,.4);}
  .rank-row.top3 .badge{width:32px;height:32px;font-size:14px;background:linear-gradient(135deg,#E3A272,#C97A3D) !important;color:#4A2408;box-shadow:0 3px 8px rgba(201,122,61,.4);}
  .rank-row.top1 .n{font-weight:900;}
  .rank-row .crown{margin-right:3px;}

  /* schedule */
  .form-row{margin-bottom:10px;}
  .form-row label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;}
  .form-row input, .form-row select{
    width:100%;border:1px solid var(--line);background:var(--card);border-radius:9px;
    padding:11px 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;color:var(--ink);
  }
  .form-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn-primary{
    display:block;width:100%;text-align:center;background:linear-gradient(135deg,var(--accent),#E06D0E);color:#fff;border:none;
    padding:13px;border-radius:10px;font-size:14.5px;font-weight:800;font-family:'Noto Sans TC',sans-serif;
    cursor:pointer;margin-top:4px;box-shadow:0 4px 12px rgba(242,128,30,.3);transition:transform .1s;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-outline{
    display:block;width:100%;text-align:center;background:transparent;color:var(--header2);
    border:1.5px solid var(--header2);padding:11px;border-radius:10px;font-size:13.5px;font-weight:700;
    font-family:'Noto Sans TC',sans-serif;cursor:pointer;margin-top:10px;transition:transform .1s;
  }
  .btn-outline:active{transform:scale(.98);}
  .btn-pressed{transform:scale(.88) !important;filter:brightness(.9);transition:transform .07s ease, filter .07s ease;}
  .btn-ghost-sm{
    background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;
    color:var(--header2);font-weight:700;cursor:pointer;
  }

  .sched-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .sched-item:last-child{border-bottom:none;}
  .sched-tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:5px;flex-shrink:0;}
  .sched-tag.league{background:#E4ECFB;color:#2451B8;}
  .sched-tag.cup{background:var(--accent-soft);color:var(--accent);}
  .sched-item .matchup{flex:1;font-size:13.5px;font-weight:700;min-width:0;}
  .opp-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex-shrink:0;}
  .sched-item .meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .sched-item .rm{color:var(--bad);font-size:12px;font-weight:700;background:none;border:none;cursor:pointer;flex-shrink:0;}

  /* roster */
  .roster-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);position:relative;overflow:hidden;}
  .roster-row::after{content:attr(data-jn);position:absolute;right:-4px;top:50%;transform:translateY(-50%);font-size:54px;font-weight:900;color:var(--header1);opacity:.05;line-height:1;pointer-events:none;font-family:'Noto Sans TC',sans-serif;}
  .roster-row:last-child{border-bottom:none;}
  .roster-row.inactive{opacity:.5;}
  .roster-row .jn{font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:13px;color:var(--header2);background:var(--chip);border-radius:7px;min-width:30px;text-align:center;padding:5px 0;flex-shrink:0;}
  .roster-row .rinfo{flex:1;min-width:0;}
  .roster-row .rname{font-size:13.5px;font-weight:700;}
  .roster-row .rjersey{font-weight:400;color:var(--muted);font-size:12px;}
  .roster-row .rmeta{font-size:11px;color:var(--muted);margin-top:2px;}
  .status-tag{font-size:10px;color:var(--bad);border:1px solid var(--bad);border-radius:5px;padding:2px 7px;flex-shrink:0;white-space:nowrap;}
  .roster-chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:100px;padding:6px 12px 6px 6px;font-size:12px;margin:0 6px 6px 0;}
  .roster-chip .av{width:20px;height:20px;border-radius:50%;background:var(--header2);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}

  /* game record */
  .score-hero{text-align:center;}
  .score-hero .vs{font-size:13px;color:var(--muted);}
  .score-hero .sc{font-size:32px;font-weight:900;margin:6px 0;display:inline-block;}
  .score-hero .inn{font-size:12px;color:var(--muted);}
  @keyframes popScore{0%{transform:scale(1);}35%{transform:scale(1.2);color:var(--accent);}100%{transform:scale(1);}}
  .score-hero .sc.pop{animation:popScore .4s ease;}
  @keyframes popOuts{0%{transform:scale(1);}35%{transform:scale(1.15);color:var(--bad);}100%{transform:scale(1);}}
  .inn .outs-n.pop{display:inline-block;animation:popOuts .4s ease;}
  .bases-mini{position:relative;width:64px;height:64px;margin:6px auto 4px;}
  .bases-mini .b-dot{position:absolute;width:20px;height:20px;border:2px solid var(--header2);background:#fff;transform:rotate(45deg);cursor:pointer;transition:transform .1s;}
  .bases-mini .b-dot:active{transform:rotate(45deg) scale(.85);}
  .bases-mini .b-dot.on{background:var(--accent);border-color:var(--accent);}
  .bases-mini .b1{right:0;bottom:10px;}
  .bases-mini .b2{left:22px;top:0;}
  .bases-mini .b3{left:0;bottom:10px;}
  .bases-label{font-size:10px;color:var(--muted);text-align:center;margin-bottom:8px;}
  .linescore{width:100%;border-collapse:collapse;font-size:11.5px;}
  .linescore th,.linescore td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  .linescore th{color:var(--muted);font-weight:700;font-size:10.5px;}
  .linescore td:first-child,.linescore th:first-child{text-align:left;font-weight:700;padding-left:2px;}
  .linescore tr.live-row{background:var(--accent-soft);}
  .linescore tr.live-row td:first-child{color:var(--accent);}
  .linescore td:last-child,.linescore th:last-child{background:var(--chip);font-weight:900;border-left:1.5px solid var(--line);}
  .linescore td.cur-inning{background:rgba(242,128,30,.12);border-radius:4px;}
  .panel-disabled{opacity:.4;pointer-events:none;}

  .field-wrap{position:relative;width:100%;max-width:300px;margin:6px auto 0;aspect-ratio:300/320;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(18,39,68,.18) inset,0 3px 10px rgba(18,39,68,.1);}
  .field-wrap svg{width:100%;height:100%;display:block;}
  .pos-badge{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:9px;padding:4px 8px;text-align:center;box-shadow:0 2px 6px rgba(18,39,68,.18);min-width:56px;line-height:1.15;}
  .pos-badge .pk{font-size:8.5px;font-weight:800;color:var(--header2);}
  .pos-badge .pn{font-size:12.5px;font-weight:900;color:var(--ink);margin-top:0;white-space:nowrap;}
  .pos-badge.rover .pk{color:var(--accent);}
  .field-wrap.mini .pos-badge{min-width:38px;padding:3px 5px;border-radius:6px;line-height:1.1;}
  .field-wrap.mini .pos-badge .pk{font-size:7.5px;}
  .field-wrap.mini .pos-badge .pn{font-size:9.5px;margin-top:0;}
  .lineup-flex{display:flex;gap:8px;align-items:flex-start;}
  .lineup-flex .compact-col{flex:1;min-width:0;}
  .lineup-flex .field-col{flex:1.4;min-width:0;}
  .compact-lineup{display:flex;flex-direction:column;gap:1px;}
  .compact-row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px;font-size:12px;}
  .compact-row.at-bat{background:var(--accent-soft);}
  .compact-row .cno{width:16px;height:16px;border-radius:50%;background:var(--header2);color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .compact-row.at-bat .cno{background:var(--accent);}
  .compact-row .cname{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .compact-row .cpos{color:var(--muted);font-size:10px;flex-shrink:0;}
  .sub-panel{background:var(--chip);border-radius:10px;padding:10px;margin-top:10px;}
  .sub-panel select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'Noto Sans TC',sans-serif;background:var(--card);color:var(--ink);}

  .order-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);border-radius:8px;transition:background .2s;}
  .order-row:last-child{border-bottom:none;}
  .order-row.at-bat{background:var(--accent-soft);margin:0 -8px;padding:7px 8px;}
  .order-row.at-bat .ord-no{background:var(--accent);box-shadow:0 0 0 3px rgba(242,128,30,.22);}
  .ord-no{font-weight:900;font-size:12px;color:#fff;background:var(--header2);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .order-row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:12.5px;font-family:'Noto Sans TC',sans-serif;background:var(--card);color:var(--ink);}
  .move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
  .move-btn{width:22px;height:17px;border:1px solid var(--line);background:var(--card);border-radius:5px;color:var(--header2);font-size:9px;line-height:1;cursor:pointer;padding:0;}
  .move-btn:disabled{opacity:.3;}
  .move-btn:active:not(:disabled){transform:scale(.9);background:var(--accent-soft);}

  .guest-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
  .guest-row:last-child{border-bottom:none;}
  .guest-row .g-no{font-size:12px;color:var(--muted);width:16px;flex-shrink:0;font-weight:700;}
  .guest-row .g-name{flex:1;font-size:13.5px;font-weight:700;}
  .guest-row .g-actions{display:flex;gap:4px;flex-shrink:0;}
  .g-actions button{width:26px;height:26px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:12px;color:var(--header2);cursor:pointer;}
  .g-actions button.danger{color:var(--bad);border-color:var(--bad);}
  .guest-add-row{display:flex;gap:8px;margin-top:10px;}
  .guest-add-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px;font-family:'Noto Sans TC',sans-serif;}
  .guest-add-row button{background:var(--header1);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:13px;font-weight:700;}

  .pitch-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .pitch-row:last-child{border-bottom:none;}
  .pitch-row .num{font-weight:800;color:var(--muted);}

  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .setting-row:last-child{border-bottom:none;}
  .setting-row .sub{font-size:11px;color:var(--muted);margin-top:2px;}

  nav.bottom{
    position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;
    background:#fff;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index:20;box-shadow:0 -2px 12px rgba(18,39,68,.08);
  }
  nav.bottom button{flex:1;background:none;border:none;color:#9AA6BB;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:'Noto Sans TC',sans-serif;padding:6px 0;cursor:pointer;position:relative;}

   );

   create policy "public read/write" on team_state for all using (true) with check (true);

   );

function snapshotState(){

function applyCloudData(d){
  if(!d) return;
  if(d.standings){ standings.length=0; standings.push(...d.standings); }
  if(d.roster){ roster.length=0; roster.push(...d.roster); }
  if(d.schedule){ schedule.length=0; schedule.push(...d.schedule); }
  if(d.guestPlayers){ guestPlayers.length=0; guestPlayers.push(...d.guestPlayers); }
  if('cupInfo' in d) cupInfo = d.cupInfo;
  if(d.cupParticipants){ cupParticipants.length=0; cupParticipants.push(...d.cupParticipants); }
  if(d.cupBattingOrder){ cupBattingOrder.length=0; cupBattingOrder.push(...d.cupBattingOrder); }
  if(d.cupFieldAssignment) Object.assign(cupFieldAssignment, d.cupFieldAssignment);
  if(d.battingOrder){ battingOrder.length=0; battingOrder.push(...d.battingOrder); }
  if(d.fieldAssignment) Object.assign(fieldAssignment, d.fieldAssignment);
  if(d.gameHistory){ gameHistory.length=0; gameHistory.push(...d.gameHistory); }
  if(d.battingStats){ Object.keys(battingStats).forEach(k=>delete battingStats[k]); Object.assign(battingStats, d.battingStats); }
  if(d.pitchingStats){ Object.keys(pitchingStats).forEach(k=>delete pitchingStats[k]); Object.assign(pitchingStats, d.pitchingStats); }
  if(d.leagueName) leagueName = d.leagueName;
  if(d.totalGames) totalGames = d.totalGames;
  if(typeof d.preseasonGamesPlayed === 'number') preseasonGamesPlayed = d.preseasonGamesPlayed;
  if(d.preseasonStreak) preseasonStreak = d.preseasonStreak;
  if(d.gameHistory){ gameHistory.length=0; gameHistory.push(...d.gameHistory); }
}
async function cloudLoad(){
  try{
    const { data, error } = await sb.from('team_state').select('data').eq('id', SYNC_ROW_ID).maybeSingle();
    if(!error && data) applyCloudData(data.data);
  }catch(e){ console.warn('雲端讀取失敗', e); }
}
let lastSentUpdatedAt = null;
async function doCloudSave(){
  const updatedAt = new Date().toISOString();
  lastSentUpdatedAt = updatedAt;
  try{ await sb.from('team_state').upsert({ id: SYNC_ROW_ID, data: snapshotState(), updated_at: updatedAt }); }
  catch(e){ console.warn('雲端儲存失敗', e); }
}
function scheduleCloudSave(){
  if(!syncEnabled) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doCloudSave, 400);
}
function flushCloudSaveNow(){
  if(!syncEnabled) return;
  clearTimeout(saveTimer);
  doCloudSave();
}
function initSync(){
  if(!SYNC_URL || !SYNC_KEY || typeof supabase==='undefined') return;
  sb = supabase.createClient(SYNC_URL, SYNC_KEY);
  syncEnabled = true;
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='hidden') flushCloudSaveNow();
    else if(document.visibilityState==='visible' && session) cloudLoad().then(()=>render({skipSave:true}));
  });
  window.addEventListener('pagehide', flushCloudSaveNow);
  sb.channel('team-state-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'team_state', filter:`id=eq.${SYNC_ROW_ID}`}, payload=>{
      if(!payload.new || !payload.new.data) return;
      if(payload.new.updated_at && payload.new.updated_at === lastSentUpdatedAt) return; // 自己剛存回去的回音,不用重畫
      applyCloudData(payload.new.data);
      const active = document.activeElement;
      const isEditing = active && ['SELECT','INPUT','TEXTAREA'].includes(active.tagName) && app.contains(active);
      if(isEditing) return; // 使用者正在點選單/打字,先套用資料就好,晚點再重畫,不要把他手上的東西關掉
      render({skipSave:true});
    })
    .subscribe();
}

async function doSignup(){

  authBusy = true; authError=''; render();
  const { data, error } = await sb.auth.signUp({ email, password: pw, options: { data: { name } } });
  authBusy = false;
  if(error){ authError = '註冊失敗:' + (error.message||''); render(); return; }
  if(!data.user){ authError = '註冊失敗,請再試一次'; render(); return; }

    render();
    return;

  // 有 session 代表不需要驗證信,onAuthStateChange 會自動登入並建立身分
}

// battingStats/pitchingStats 是「手動基準值」(球員編輯表單校正用,不含任何一場比賽的紀錄)
// 球季總數 = 手動基準值 + 所有已結束比賽的單場紀錄加總 + 進行中比賽即時累加
// 這樣刪除某一場比賽紀錄,那一場貢獻的數據會自動從總數消失,不會殘留
let battingStats = {};

function statOf(store, name){
  if(!store[name]) store[name] = {AB:0,H:0,BB:0,R:0,HR:0,outs:0,K:0,ER:0,W:0};
  return store[name];
}
function mergeStatsInto(target, source){
  Object.keys(source||{}).forEach(name=>{
    const s = source[name];
    const t = statOf(target, name);
    t.AB+=s.AB||0; t.H+=s.H||0; t.BB+=s.BB||0; t.R+=s.R||0; t.HR+=s.HR||0;
    t.outs+=s.outs||0; t.K+=s.K||0; t.ER+=s.ER||0; t.W+=s.W||0;
  });
}
function computeSeasonStats(){

  });

  });
  return { bat, pitch };
}
function avgOf(store, name){
  const s = store[name];
  if(!s || !s.AB) return '.000';
  return (s.H/s.AB).toFixed(3).replace(/^0/,'');
}
function ipOf(store, name){
  const s = store[name];
  if(!s) return '0.0';
  return `${Math.floor(s.outs/3)}.${s.outs%3}`;
}
function eraOf(store, name){
  const s = store[name];
  if(!s || !s.outs) return '0.00';
  const innings = s.outs/3;
  return (s.ER/innings*7).toFixed(2); // 七局制簡易換算,可自行調整
}
function leagueResultsChrono(){
  return gameHistory.filter(r=>r.type==='聯賽')
    .slice()
    .sort((a,b)=> (a.date||'').localeCompare(b.date||'') || (a.time||'').localeCompare(b.time||''))
    .map(r=>({...r, outcome: r.us>r.them?'W':r.us<r.them?'L':'T'}));
}
function currentStreak(){
  const res = leagueResultsChrono();
  if(!res.length) return preseasonStreak.type ? { type:preseasonStreak.type, count:preseasonStreak.count } : null;
  const last = res[res.length-1].outcome;
  let count = 0;
  for(let i=res.length-1;i>=0;i--){ if(res[i].outcome===last) count++; else break; }
  if(count === res.length && preseasonStreak.type === last) count += preseasonStreak.count;
  return { type:last, count };
}
function headToHeadRecords(){
  const map = {};
  gameHistory.filter(r=>r.type==='聯賽').forEach(r=>{
    if(!map[r.opp]) map[r.opp] = { opp:r.opp, w:0, l:0, t:0 };
    const m = map[r.opp];
    if(r.us>r.them) m.w++; else if(r.us<r.them) m.l++; else m.t++;
  });
  return Object.values(map).sort((a,b)=> (b.w+b.l+b.t)-(a.w+a.l+a.t));
}
function gameMVP(rec){
  let best = null, bestScore = -Infinity, bestType = null, bestStat = null;
  Object.keys(rec.box.bat||{}).forEach(name=>{
    const s = rec.box.bat[name];
    const score = (s.H||0) + (s.HR||0)*2 + (s.R||0)*0.5 + (s.BB||0)*0.3;
    if(score>bestScore){ bestScore = score; best = name; bestType='bat'; bestStat = s; }
  });
  Object.keys(rec.box.pitch||{}).forEach(name=>{
    const s = rec.box.pitch[name];
    const score = Math.floor((s.outs||0)/3)*1.2 + (s.K||0)*0.8 - (s.ER||0)*0.8 + (s.W||0)*2;
    if(score>bestScore){ bestScore = score; best = name; bestType='pitch'; bestStat = s; }
  });
  if(bestScore<=0 || !best) return null;
  let line = '';
  if(bestType==='bat'){
    const parts = [`${bestStat.AB}打數${bestStat.H}安打`];
    if(bestStat.HR) parts.push(`${bestStat.HR}支全壘打`);
    if(bestStat.R) parts.push(`貢獻${bestStat.R}分`);
    if(bestStat.BB) parts.push(`${bestStat.BB}次保送`);
    line = parts.join('、');
  } else {
    const parts = [`主投${Math.floor(bestStat.outs/3)}.${bestStat.outs%3}局`];
    if(bestStat.K) parts.push(`${bestStat.K}次三振`);
    parts.push(`失${bestStat.ER||0}分自責`);
    if(bestStat.W) parts.push('拿下勝投');
    line = parts.join('、');
  }
  return { name: best, line };
}
function playerAppearanceCounts(){
  const counts = {};
  gameHistory.forEach(rec=>{
    const names = new Set([...Object.keys(rec.box.bat||{}), ...Object.keys(rec.box.pitch||{})]);
    names.forEach(n=>{ counts[n] = (counts[n]||0) + 1; });
  });
  return counts;
}
function playerGameLog(name){
  return gameHistory
    .filter(rec => (rec.box.bat && rec.box.bat[name]) || (rec.box.pitch && rec.box.pitch[name]))
    .map(rec => ({ id:rec.id, date:rec.date, time:rec.time, opp:rec.opp, type:rec.type, bat:rec.box.bat?.[name], pitch:rec.box.pitch?.[name] }))

}

    if(g.pitch) parts.push(`投:${Math.floor(g.pitch.outs/3)}.${g.pitch.outs%3}局 ${g.pitch.H}被安打 ${g.pitch.K}三振 ${g.pitch.ER}自責分`);

function newLiveState(opp, battingFirst, scheduleIdx){
  return {
    id: 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    opp: opp||'對手',
    battingFirst,            // 'us' 先攻 / 'them' 我隊後攻(對方先攻)
    half: battingFirst,      // 目前是誰在打擊
    inning: 1,
    outs: 0,
    batterPtr: 0,
    us: 0, them: 0,
    bases: {1:false,2:false,3:false}, // 目前打擊方的壘上跑者
    innings: [],             // [{us:null|num, them:null|num}, ...] 每局比分
    scheduleIdx,
    log: []
  };
}
let liveGame = { lg:null, cup:null };  // 進行中比賽狀態,依 ns 分開
let scoringPitcher = { lg:'', cup:'' }; // 記錄用的投手,可跟打序裡的 P 不同(換投用)
let pendingBatFirst = { lg:'us', cup:'us' };
let pendingGameChoice = { lg: {sel:'', opp:''}, cup: {sel:'', opp:''} };
let gameHistory = []; // 每一場結束後的完整紀錄(逐局比分+打擊/投手box score)

function computeGameBoxScore(g){
  const bat = {}, pitch = {};
  g.log.forEach(entry=>{
    if(entry.store==='bat'){
      const bs = statOf(bat, entry.name); const t = entry.type;
      if(t==='1B'||t==='2B'||t==='3B'){ bs.AB++; bs.H++; }
      else if(t==='HR'){ bs.AB++; bs.H++; bs.HR++; bs.R++; }
      else if(t==='BB'){ bs.BB++; }
      else if(t==='OUT'){ bs.AB++; }
    } else if(entry.store==='pitch'){
      const ps = statOf(pitch, entry.name); const t = entry.type;
      if(t==='OUT') ps.outs++;
      else if(t==='K'){ ps.K++; ps.outs++; }
      else if(t==='H') ps.H++;
      else if(t==='BB') ps.BB++;
      else if(t==='R') ps.R++;
      else if(t==='ER') ps.ER++;
      else if(t==='W') ps.W++;
    }
  });
  return {bat, pitch};
}

function orderArrOf(ns){
  if(ns==='cup') return cupBattingOrder;
  if(ns && ns.indexOf('plan:')===0){
    const idx = +ns.slice(5);
    const s = schedule[idx];
    if(!s) return [];
    if(!s.plannedLineup) s.plannedLineup = new Array(10).fill(null).map(()=>({player:'',pos:''}));
    return s.plannedLineup;
  }
  return battingOrder;
}
function lineupPitcher(ns){
  const row = orderArrOf(ns).find(r=>r.pos==='P');
  return row ? row.player : '';
}
function activePitcher(ns){ return scoringPitcher[ns] || lineupPitcher(ns); }

function ensureInningRow(g, idx){
  while(g.innings.length <= idx) g.innings.push({us:null, them:null});
}
function switchHalfIfNeeded(g){
  if(g.outs < 3) return;
  const idx = g.inning - 1;
  ensureInningRow(g, idx);
  if(g.innings[idx][g.half] == null) g.innings[idx][g.half] = 0;
  g.outs = 0;
  g.bases = {1:false,2:false,3:false};
  if(g.half === g.battingFirst){
    g.half = (g.battingFirst==='us') ? 'them' : 'us';
  } else {
    g.half = g.battingFirst;
    g.inning++;
  }
}

// 簡化版跑壘規則:安打/全壘打時,場上跑者跟打者一起前進同樣的壘數
function advanceRunners(g, n){
  let runs = 0;
  const old = {...g.bases};
  g.bases = {1:false,2:false,3:false};
  [1,2,3].forEach(b=>{
    if(old[b]){
      const dest = b + n;
      if(dest >= 4) runs++; else g.bases[dest] = true;
    }
  });
  if(n < 4) g.bases[n] = true; else runs++; // n=4 是全壘打,打者也回本壘
  return runs;
}
// 保送/四壞:只有被逼進壘的跑者才會前進
function forceWalk(g){
  let runs = 0;
  if(g.bases[1]){
    if(g.bases[2]){
      if(g.bases[3]) runs++;
      g.bases[3] = true;
    } else {
      g.bases[2] = true;
    }
  }
  g.bases[1] = true;
  return runs;
}

function recordBat(ns, type){
  const g = liveGame[ns];
  if(!g){ toast('請先開始比賽'); return; }
  if(g.half!=='us'){ toast('現在是對方打擊,先記錄投手那邊'); return; }
  const order = orderArrOf(ns).filter(r=>r.player);
  if(!order.length){ toast('請先在打序中選擇球員'); return; }
  const batter = order[g.batterPtr % order.length].player;
  const prevGame = {...g, innings: g.innings.map(r=>({...r})), bases: {...g.bases}};
  if(type==='1B'||type==='2B'||type==='3B'){
    const n = type==='1B'?1:type==='2B'?2:3;
    const runs = advanceRunners(g, n);
    if(runs){ g.us += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].us = (g.innings[g.inning-1].us||0) + runs; }
  }
  else if(type==='HR'){
    const runs = advanceRunners(g, 4);
    g.us += runs;
    ensureInningRow(g, g.inning-1);
    g.innings[g.inning-1].us = (g.innings[g.inning-1].us||0) + runs;
  }
  else if(type==='BB'){
    const runs = forceWalk(g);
    if(runs){ g.us += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].us = (g.innings[g.inning-1].us||0) + runs; }
  }
  else if(type==='OUT'){ g.outs++; }
  g.batterPtr++;
  switchHalfIfNeeded(g);
  g.log.push({store:'bat', name:batter, type, prevGame});
  render();
}
function recordPitch(ns, type){
  const g = liveGame[ns];
  if(!g){ toast('請先開始比賽'); return; }
  if(g.half==='us'){ toast('現在我隊在打擊,先記錄打者那邊'); return; }
  const pitcher = activePitcher(ns);
  if(!pitcher){ toast('請先在打序中指定投手,或用下拉選單選投手'); return; }
  const prevGame = {...g, innings: g.innings.map(r=>({...r})), bases: {...g.bases}};
  if(type==='OUT'){ g.outs++; }
  else if(type==='K'){ g.outs++; }
  else if(type==='H'){
    const runs = advanceRunners(g, 1);
    if(runs){ g.them += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + runs; }
  }
  else if(type==='BB'){
    const runs = forceWalk(g);
    if(runs){ g.them += runs; ensureInningRow(g, g.inning-1); g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + runs; }
  }
  else if(type==='R'){
    g.them++;
    ensureInningRow(g, g.inning-1);
    g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + 1;
  }
  switchHalfIfNeeded(g);
  g.log.push({store:'pitch', name:pitcher, type, prevGame});
  render();
}
function recordOppRun(ns){
  const g = liveGame[ns];
  if(!g){ toast('請先開始比賽'); return; }
  const prevGame = {...g, innings: g.innings.map(r=>({...r})), bases: {...g.bases}};
  g.them++;
  ensureInningRow(g, g.inning-1);
  g.innings[g.inning-1].them = (g.innings[g.inning-1].them||0) + 1;
  g.log.push({store:null, type:'OPPRUN', prevGame});
  render();
}
function undoLast(ns){
  const g = liveGame[ns];
  if(!g || !g.log.length){ toast('沒有可以復原的紀錄'); return; }
  const last = g.log.pop();
  Object.assign(g, last.prevGame);
  render();
}
function updateStandingsFromResult(us, them){
  const me = standings.find(r=>r.me);
  if(!me) return;
  if(us > them) me.w++;
  else if(us < them) me.l++;
  else me.t++;
  const g = me.w + me.l + me.t;
  me.pct = g ? (me.w/g).toFixed(3).replace(/^0/,'') : '.000';
  standings.sort((a,b)=> (b.w-b.l) - (a.w-a.l));
  standings.forEach((r,i)=> r.rank = i+1);
}

function endGame(ns){
  const g = liveGame[ns];
  if(!g) return;
  const idx = g.inning - 1;
  ensureInningRow(g, idx);
  if(g.innings[idx][g.half] == null) g.innings[idx][g.half] = 0;
  const opp = g.opp;
  const finalUs = g.us, finalThem = g.them;
  if(finalUs > finalThem){
    const alreadyHasWin = g.log.some(l=>l.store==='pitch' && l.type==='W');
    if(!alreadyHasWin){
      const pitcher = activePitcher(ns);
      if(pitcher) g.log.push({store:'pitch', name:pitcher, type:'W'});
    }
  }
  const box = computeGameBoxScore(g);
  const sched = (g.scheduleIdx!=null) ? schedule[g.scheduleIdx] : null;
  const gameType = sched ? sched.type : (ns==='cup'?'盃賽':'聯賽');
  const finalOrder = orderArrOf(ns);
  const lineup = finalOrder.filter(r=>r.player).map(r=>r.player);
  const substitutions = [];
  if(g.startingLineup){
    finalOrder.forEach((row,i)=>{
      const start = g.startingLineup[i];
      if(start && start.player && row.player && start.player !== row.player){
        substitutions.push(`第${i+1}棒:${start.player} → ${row.player}`);
      }
    });
  }
  const record = {
    id: g.id, ns, opp, us: finalUs, them: finalThem, innings: g.innings,
    date: sched?sched.date:'', time: sched?sched.time:'', type: gameType,
    box, lineup, substitutions
  };
  gameHistory.push(record);
  if(sched){ sched.result = `${finalUs}:${finalThem}`; sched.historyId = g.id; }
  if(gameType === '聯賽') updateStandingsFromResult(finalUs, finalThem);
  toast(`比賽結束:南機場 ${finalUs} : ${finalThem} ${opp}`);
  liveGame[ns] = null;
  render();
  flushCloudSaveNow();
}

function computeLeaderboard(kind){
  const season = computeSeasonStats();
  if(kind==='apps'){
    const counts = playerAppearanceCounts();
    return Object.keys(counts)
      .sort((a,b)=> counts[b]-counts[a])
      .map(n=> ({name:n, team:'南機場', val:String(counts[n]), color:'#2F6FED'}));
  }
  if(kind==='avg' || kind==='hits'){
    return Object.keys(season.bat)
      .filter(n=>season.bat[n].AB>0)
      .map(n=>({name:n, team:'南機場', ab:season.bat[n].AB, h:season.bat[n].H}))
      .sort((a,b)=> kind==='avg' ? (b.h/b.ab)-(a.h/a.ab) : b.h-a.h)
      .map(r=> ({name:r.name, team:r.team, val: kind==='avg' ? (r.h/r.ab).toFixed(3).replace(/^0/,'') : String(r.h), color:'#F2801E'}));
  }
  return Object.keys(season.pitch)
    .filter(n=>season.pitch[n].outs>0 || season.pitch[n].W>0)
    .map(n=>({name:n, team:'南機場', w:season.pitch[n].W, era:parseFloat(eraOf(season.pitch,n))}))
    .sort((a,b)=> kind==='wins' ? b.w-a.w : a.era-b.era)
    .map(r=> ({name:r.name, team:r.team, val: kind==='wins' ? String(r.w) : r.era.toFixed(2), color:'#2F6FED'}));
}

const oppColorPalette = ['#F2801E','#2F6FED','#16A34A','#DB2777','#7C3AED','#0EA5E9','#D97706','#DC2626','#059669','#4F46E5','#EA580C','#0891B2'];
function opponentColor(name){
  if(!name) return '#8592A8';
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) >>> 0; }
  return oppColorPalette[hash % oppColorPalette.length];
}
function orphanGameRecords(){
  const linkedIds = new Set(schedule.map(s=>s.historyId).filter(Boolean));
  return gameHistory.filter(r=>!linkedIds.has(r.id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
}

function usedPlayers(orderArr, excludeIdx){ return orderArr.filter((r,i)=>i!==excludeIdx && r.player).map(r=>r.player); }
function usedPositions(orderArr, excludeIdx){ return orderArr.filter((r,i)=>i!==excludeIdx && r.pos && r.pos!=='EP').map(r=>r.pos); }

function playerOptions(selected, pool, exclude, bench){
  const ex = exclude||[];
  const benchSet = bench ? new Set(bench) : null;
  return `<option value="">— 選擇球員 —</option>` +
    pool.filter(name=> name===selected || !ex.includes(name))
        .map(name=>`<option value="${name}" ${selected===name?'selected':''}>${benchSet&&benchSet.has(name)?'🪑 ':''}${name}</option>`).join('');
}
function posOptions(selected, exclude){
  const ex = exclude||[];
  const regular = fieldPositions.filter(p=> p.key===selected || !ex.includes(p.key))
      .map(p=>`<option value="${p.key}" ${selected===p.key?'selected':''}>${p.label}</option>`).join('');
  const ep = `<option value="EP" ${selected==='EP'?'selected':''}>指定球員(EP)</option>`;
  return `<option value="">— 守位 —</option>` + regular + ep;
}

function renderCompactLineup(orderArr, curIdx){
  const filled = orderArr.map((r,i)=>({...r, idx:i})).filter(r=>r.player);
  if(!filled.length) return `<div style="font-size:11.5px;color:var(--muted);padding:6px 0;">尚未排打序,點右上「編輯」開始排。</div>`;
  return `<div class="compact-lineup">
    ${filled.map(row=>`
      <div class="compact-row ${curIdx!=null && row.idx===curIdx?'at-bat':''}">
        <span class="cno">${row.idx+1}</span>
        <span class="cname">${row.player}</span>
        <span class="cpos">${row.pos==='EP'?'EP':(row.pos?(fieldPositions.find(p=>p.key===row.pos)?.label||row.pos):'—')}</span>
      </div>`).join('')}
  </div>`;
}
function renderBattingOrder(orderArr, pool, ns, curIdx, bench){
  const filled = orderArr.filter(r=>r.player).length;
  const expanded = lineupExpanded[ns];
  return `
    <div class="section-head" style="margin-bottom:${expanded?'8px':'0'};">
      <span style="font-size:12px;color:var(--muted);">已排 ${filled} / ${orderArr.length} 棒</span>
      <a data-action="toggleLineup" data-ns="${ns}">${expanded?'收起 ▲':'展開 ▼'}</a>
    </div>
    ${expanded ? `
      ${orderArr.map((row,i)=>`
        <div class="order-row ${curIdx!=null && i===curIdx ? 'at-bat':''}">
          <div class="ord-no">${i+1}</div>
          <select data-order-ns="${ns}" data-order-idx="${i}" data-order-field="player">${playerOptions(row.player, pool, usedPlayers(orderArr,i), bench)}</select>
          <select data-order-ns="${ns}" data-order-idx="${i}" data-order-field="pos">${posOptions(row.pos, usedPositions(orderArr,i))}</select>
          <div class="move-btns">
            <button class="move-btn" data-move="up" data-order-ns="${ns}" data-order-idx="${i}" ${i===0?'disabled':''} aria-label="上移">▲</button>
            <button class="move-btn" data-move="down" data-order-ns="${ns}" data-order-idx="${i}" ${i===orderArr.length-1?'disabled':''} aria-label="下移">▼</button>
          </div>
        </div>`).join('')}
      <button class="btn-outline" data-action="addBatter" data-ns="${ns}">+ 新增打者</button>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;">選好打者跟守位,右邊 ▲▼ 可以直接跟上/下一棒交換順序。同一個守位不會出現在別列(EP 例外)。${bench&&bench.length?' 打者選單裡 🪑 開頭的是候補。':''}</div>
      ${bench && bench.length ? `<div style="margin-top:8px;">
        <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;">🪑 候補待命</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${bench.map(n=>`<span style="background:var(--chip);color:var(--muted);font-size:11px;font-weight:700;padding:4px 9px;border-radius:100px;">${n}</span>`).join('')}</div>
      </div>` : ''}
    ` : ''}
  `;
}

function renderFieldDiagram(orderArr, ns, compact){
  const posMap = {};
  orderArr.forEach(r=>{ if(r.pos) posMap[r.pos] = r.player; });
  return `
    <div class="field-wrap ${compact?'mini':''}">
      <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grassGrad-${ns}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6BC06E"/>
            <stop offset="100%" stop-color="#4B9350"/>
          </linearGradient>
          <linearGradient id="dirtGrad-${ns}" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#DCB489"/>
            <stop offset="100%" stop-color="#B4835A"/>
          </linearGradient>
          <pattern id="mow-${ns}" width="26" height="320" patternUnits="userSpaceOnUse" patternTransform="rotate(45 150 160)">
            <rect width="13" height="320" fill="#000" opacity="0.045"/>
          </pattern>
        </defs>
        <rect x="0" y="0" width="300" height="320" fill="url(#grassGrad-${ns})"/>
        <rect x="0" y="0" width="300" height="320" fill="url(#mow-${ns})"/>
        <polygon points="150,300 265,185 150,70 35,185" fill="url(#dirtGrad-${ns})"/>
        <polygon points="150,280 225,213 150,145 75,213" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
        <circle cx="150" cy="207" r="9" fill="#EFE3D0" stroke="#fff" stroke-width="2"/>
        <polygon points="150,292 145,300 155,300" fill="#fff" opacity="0.9"/>
      </svg>
      ${fieldPositions.map(p=>`
        <div class="pos-badge ${p.rover?'rover':''}" style="left:${(p.x/300*100).toFixed(1)}%;top:${(p.y/320*100).toFixed(1)}%;">
          <div class="pk">${p.rover?'Rover':p.label}</div>
          <div class="pn">${posMap[p.key] || '—'}</div>
        </div>`).join('')}
    </div>
    ${compact ? '' : `<div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;">守備陣型依打序裡每個人選的守位自動排出來,要換人請回去改打序。</div>`}
  `;
}

let recordNs = 'lg';

let viewingGameId = null;

function renderLineScoreStatic(rec){
  const cols = rec.innings.length;
  return `
    <table class="linescore">
      <tr><th></th>${Array.from({length:cols},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th></tr>
      <tr><td>南機場</td>${rec.innings.map(r=>`<td>${r.us==null?'':r.us}</td>`).join('')}<td><b>${rec.us}</b></td></tr>
      <tr><td>${rec.opp}</td>${rec.innings.map(r=>`<td>${r.them==null?'':r.them}</td>`).join('')}<td><b>${rec.them}</b></td></tr>
    </table>
  `;
}
function renderBoxBatting(bat, lineup){
  let names = Object.keys(bat);
  if(!names.length) return emptyState('這場沒有打擊紀錄');
  if(lineup && lineup.length){
    names = names.slice().sort((a,b)=>{
      const ia = lineup.indexOf(a), ib = lineup.indexOf(b);
      if(ia===-1 && ib===-1) return 0;
      if(ia===-1) return 1;
      if(ib===-1) return -1;
      return ia-ib;
    });
  }
  return `
    <table class="linescore">
      <tr><th style="text-align:left;">打者</th><th>打數</th><th>安打</th><th>全壘打</th><th>保送</th><th>單場打擊率</th></tr>
      ${names.map(n=>{const s=bat[n]; const avg = s.AB ? (s.H/s.AB).toFixed(3).replace(/^0/,'') : '.000'; return `<tr><td style="text-align:left;">${n}</td><td>${s.AB}</td><td>${s.H}</td><td>${s.HR}</td><td>${s.BB}</td><td>${avg}</td></tr>`;}).join('')}
    </table>
  `;
}
function renderBoxPitching(pitch){
  const names = Object.keys(pitch);
  if(!names.length) return emptyState('這場沒有投手紀錄');
  return `
    <table class="linescore">
      <tr><th style="text-align:left;">投手</th><th>局數</th><th>被安打</th><th>保送</th><th>三振</th><th>自責分</th><th>勝</th></tr>
      ${names.map(n=>{const s=pitch[n]; return `<tr><td style="text-align:left;">${n}</td><td>${Math.floor(s.outs/3)}.${s.outs%3}</td><td>${s.H}</td><td>${s.BB}</td><td>${s.K}</td><td>${s.ER}</td><td>${s.W}</td></tr>`;}).join('')}
    </table>
  `;
}

  const idx = planningScheduleIdx;
  const s = schedule[idx];
  if(!s) return `<section><div class="card">${emptyState('找不到這場賽程')}</div></section>`;
  const ns = 'plan:'+idx;
  if(lineupExpanded[ns]===undefined) lineupExpanded[ns] = true;
  const pool = [...activeRoster().map(p=>p.name), ...guestPlayers.map(g=>g.name)];
  if(!s.plannedBench) s.plannedBench = [];
  const starters = new Set(orderArrOf(ns).filter(r=>r.player).map(r=>r.player));
  return `
  <section>
    <a data-nav="schedule" style="font-size:12px;color:var(--header2);font-weight:700;">‹ 返回賽程</a>
    <div class="card" style="margin-top:10px;">
      <div class="section-title" style="margin:0;">🗒️ 預排打序 · 南機場 vs ${s.opp}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:4px;">${s.type}${s.stage?' · '+s.stage:''} · ${s.date||'日期未定'}${s.time?' '+s.time:''}</div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px;line-height:1.6;">先排好先發打序、守位跟候補,比賽當天按「開始比賽」選這場,會自動帶進去,不用臨場才排。中途要換人,記錄比賽時一樣可以直接改。</div>

  <section>
    <div class="section-head"><div class="section-title" style="margin:0;">守備陣型</div></div>
    <div class="card">${renderFieldDiagram(orderArrOf(ns), ns)}</div>
  </section>
  <section>
    <div class="section-title">🪑 候補名單</div>

      <div style="font-size:11px;color:var(--muted);line-height:1.6;padding:8px 0 4px;">勾選這場可以隨時上場替補的人。記錄比賽時,打序的球員下拉選單裡候補會特別標示,方便你臨時換人。</div>
      ${pool.filter(name=>!starters.has(name)).map(name=>`
        <label class="roster-row" style="cursor:pointer;">
          <input type="checkbox" data-bench-pick="${name}" data-plan-idx="${idx}" ${s.plannedBench.includes(name)?'checked':''} style="width:18px;height:18px;flex-shrink:0;" />
          <div class="rinfo"><div class="rname">${name}</div></div>
        </label>`).join('') || `<div style="font-size:11.5px;color:var(--muted);padding:8px 0;">名單裡的人都排進先發了</div>`}
    </div>
  </section>
  `;
}
function viewGameDetail(){
  const rec = gameHistory.find(r=>r.id===viewingGameId);
  if(!rec) return `<section><div class="card">${emptyState('找不到這場比賽的紀錄')}</div></section>`;
  const mvp = gameMVP(rec);
  return `
  <section>
    <a data-nav="schedule" style="font-size:12px;color:var(--header2);font-weight:700;">‹ 返回賽程</a>
    <div class="card score-hero" style="margin-top:10px;">
      <div class="vs">南機場 vs ${rec.opp}</div>
      <div class="sc">${rec.us} : ${rec.them}</div>
      <div class="inn">${rec.type} · ${rec.date||''}${rec.time?' '+rec.time:''}</div>
      ${mvp?`<div style="margin-top:8px;">
        <div style="display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#FFD65C,#F2A93B);color:#7A4B00;font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:100px;">⭐ 單場MVP · ${mvp.name}</div>

      <div style="margin-top:12px;overflow-x:auto;">${renderLineScoreStatic(rec)}</div>
    </div>
  </section>
  ${rec.substitutions && rec.substitutions.length ? `
  <section>
    <div class="section-title">🔄 換人紀錄</div>
    <div class="card">
      ${rec.substitutions.map(s=>`<div style="font-size:12.5px;padding:5px 0;">${s}</div>`).join('')}

  ` : ''}
  <section>

  <section>
    <div class="section-title">⚾ 投手紀錄</div>
    <div class="card" style="overflow-x:auto;">${renderBoxPitching(rec.box.pitch)}</div>
  </section>
  <section>
    <div class="card"><div style="font-size:11px;color:var(--muted);line-height:1.6;">🤖 MVP 是依這場的安打、全壘打、保送、三振、局數等數字自動算出來的參考值,不是正式獎項。</div></div>

    </div>
  </section>
  ` : ''}
  `;
}

function renderBasesIndicator(g, ns){
  if(!g) return '';
  return `
    <div class="bases-mini">
      <div class="b-dot b2 ${g.bases[2]?'on':''}" data-toggle-base="2" data-ns="${ns}"></div>
      <div class="b-dot b3 ${g.bases[3]?'on':''}" data-toggle-base="3" data-ns="${ns}"></div>
      <div class="b-dot b1 ${g.bases[1]?'on':''}" data-toggle-base="1" data-ns="${ns}"></div>
    </div>
    <div class="bases-label">目前壘上:${[g.bases[1]&&'一壘',g.bases[2]&&'二壘',g.bases[3]&&'三壘'].filter(Boolean).join('、')||'無人上壘'} <span style="color:var(--muted);">· 點壘包可手動修正</span></div>
  `;
}

function renderLineScore(g){
  const cols = Math.max(g.inning, g.innings.length);
  const cell = (i, side) => {
    if(g.innings[i] && g.innings[i][side]!=null) return g.innings[i][side];
    if(i===g.inning-1 && g.half===side) return 0; // 這半局進行中還沒得分
    return '';
  };
  const curCls = i => i===g.inning-1 ? 'cur-inning' : '';
  return `
    <table class="linescore">
      <tr><th></th>${Array.from({length:cols},(_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th></tr>
      <tr class="${g.half==='us'?'live-row':''}"><td>南機場</td>${Array.from({length:cols},(_,i)=>`<td class="${curCls(i)}">${cell(i,'us')}</td>`).join('')}<td><b>${g.us}</b></td></tr>
      <tr class="${g.half==='them'?'live-row':''}"><td>${g.opp}</td>${Array.from({length:cols},(_,i)=>`<td class="${curCls(i)}">${cell(i,'them')}</td>`).join('')}<td><b>${g.them}</b></td></tr>
    </table>
  `;
}

/* ---------- 事件綁定 ---------- */
function bindDynamicHandlers(){
  app.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      currentView = el.dataset.nav;
      if(el.dataset.sub) statsSubtab = el.dataset.sub;
      if(el.dataset.recns) recordNs = el.dataset.recns;
      setActiveNav(); render(); window.scrollTo(0,0);
      if(currentView==='settings' && isAdmin() && !allProfiles.length) refreshMembers();
    });
  });
  app.querySelectorAll('[data-statsub]').forEach(el=>{
    el.addEventListener('click', ()=>{ statsSubtab = el.dataset.statsub; render(); });
  });
  app.querySelectorAll('[data-ranktab]').forEach(el=>{
    el.addEventListener('click', ()=>{ rankTab = el.dataset.ranktab; render(); });
  });
  const statSel = document.getElementById('statPlayerSel');
  if(statSel) statSel.addEventListener('change', ()=>{ selectedStatPlayer = statSel.value; render(); });
  const schedTypeSel = document.getElementById('schedType');
  if(schedTypeSel) schedTypeSel.addEventListener('change', ()=>{
    document.getElementById('schedStageRow').style.display = schedTypeSel.value==='盃賽' ? 'block' : 'none';
  });
  const schedOppSel = document.getElementById('schedOppSel');
  if(schedOppSel) schedOppSel.addEventListener('change', ()=>{
    document.getElementById('schedOppNew').style.display = schedOppSel.value==='__new__' ? 'block' : 'none';
  });
  const schedPlaceSel = document.getElementById('schedPlaceSel');
  if(schedPlaceSel) schedPlaceSel.addEventListener('change', ()=>{
    document.getElementById('schedPlaceNew').style.display = schedPlaceSel.value==='__new__' ? 'block' : 'none';
  });

  app.querySelectorAll('[data-order-ns]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const arr = orderArrOf(el.dataset.orderNs);
      arr[+el.dataset.orderIdx][el.dataset.orderField] = el.value;
      render();
    });
  });
  app.querySelectorAll('[data-move]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const arr = orderArrOf(el.dataset.orderNs);
      const idx = +el.dataset.orderIdx;
      const swapWith = el.dataset.move==='up' ? idx-1 : idx+1;
      if(swapWith<0 || swapWith>=arr.length) return;
      [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];
      if(navigator.vibrate) navigator.vibrate(10);
      render();
    });
  });
  app.querySelectorAll('[data-pos-pick]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const arr = orderArrOf(el.dataset.orderNs);
      const idx = +el.dataset.orderIdx;
      const val = el.dataset.posPick;
      const row = arr[idx];
      row.pos = (row.pos === val) ? '' : val;
      if(navigator.vibrate) navigator.vibrate(10);
      render();
    });
  });
  const pitcherSel = document.getElementById('pitcherSel');
  if(pitcherSel) pitcherSel.addEventListener('change', ()=>{ scoringPitcher[recordNs] = pitcherSel.value; render(); });
  app.querySelectorAll('[data-cup-pick]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const name = el.dataset.cupPick;
      if(el.checked){ if(!cupParticipants.includes(name)) cupParticipants.push(name); }
      else{ cupParticipants = cupParticipants.filter(n=>n!==name); }
      render();
    });
  });
  app.querySelectorAll('[data-bench-pick]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const s = schedule[+el.dataset.planIdx];
      if(!s) return;
      const name = el.dataset.benchPick;
      if(!s.plannedBench) s.plannedBench = [];
      if(el.checked){ if(!s.plannedBench.includes(name)) s.plannedBench.push(name); }
      else{ s.plannedBench = s.plannedBench.filter(n=>n!==name); }
      render();
    });
  });
  app.querySelectorAll('[data-guest-up]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!requireAdmin())return;
      const i = +el.dataset.guestUp;
      [guestPlayers[i-1], guestPlayers[i]] = [guestPlayers[i], guestPlayers[i-1]];
      render();
    });
  });
  app.querySelectorAll('[data-guest-down]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!requireAdmin())return;
      const i = +el.dataset.guestDown;
      [guestPlayers[i+1], guestPlayers[i]] = [guestPlayers[i], guestPlayers[i+1]];
      render();
    });
  });
  app.querySelectorAll('[data-guest-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{ if(!requireAdmin())return; guestPlayers.splice(+el.dataset.guestRemove,1); render(); });
  });
  app.querySelectorAll('[data-sched-remove]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(!requireAdmin())return;
      const idx = +el.dataset.schedRemove;
      const s = schedule[idx];
      if(s && s.historyId){
        if(!confirm('這場比賽已經有紀錄比分和數據,刪除賽程會連同那場的打擊/投手數據一起刪掉,確定嗎?')) return;
        const hIdx = gameHistory.findIndex(r=>r.id===s.historyId);
        if(hIdx>=0) gameHistory.splice(hIdx,1);
      }
      schedule.splice(idx,1);
      render();
      flushCloudSaveNow();
    });
  });
  app.querySelectorAll('[data-sched-view]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const s = schedule[+el.dataset.schedView];
      if(s && s.historyId){ viewingGameId = s.historyId; currentView = 'gameDetail'; setActiveNav(); render(); window.scrollTo(0,0); }
    });
  });
  app.querySelectorAll('[data-gamelog-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      viewingGameId = el.dataset.gamelogId; currentView = 'gameDetail'; setActiveNav(); render(); window.scrollTo(0,0);
    });
  });
  function pressFeedback(el){
    el.classList.add('btn-pressed');
    if(navigator.vibrate) navigator.vibrate(12);
  }
  app.querySelectorAll('[data-rec]').forEach(el=>{
    el.addEventListener('click', ()=>{ pressFeedback(el); setTimeout(()=> recordBat(el.dataset.ns, el.dataset.rec), 70); });
  });
  app.querySelectorAll('[data-pitch]').forEach(el=>{
    el.addEventListener('click', ()=>{ pressFeedback(el); setTimeout(()=> recordPitch(el.dataset.ns, el.dataset.pitch), 70); });
  });
  app.querySelectorAll('[data-batfirst]').forEach(el=>{
    el.addEventListener('click', ()=>{ pendingBatFirst[el.dataset.ns] = el.dataset.batfirst; render(); });
  });
  app.querySelectorAll('[data-toggle-base]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const g = liveGame[el.dataset.ns];
      if(!g) return;
      const b = el.dataset.toggleBase;
      g.bases[b] = !g.bases[b];
      if(navigator.vibrate) navigator.vibrate(12);
      render();
    });
  });
  const startGameSelEl = document.getElementById('startGameSel');
  if(startGameSelEl) startGameSelEl.addEventListener('change', ()=>{ pendingGameChoice[startGameSelEl.dataset.ns].sel = startGameSelEl.value; });
  const startOppEl = document.getElementById('startOpp');
  if(startOppEl) startOppEl.addEventListener('input', ()=>{ pendingGameChoice[startOppEl.dataset.ns].opp = startOppEl.value; });
  app.querySelectorAll('[data-edit-player]').forEach(el=>{
    el.addEventListener('click', ()=>{ if(!requireAdmin())return; editingPlayerIdx = +el.dataset.editPlayer; render(); window.scrollTo(0,0); });
  });
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const act = el.dataset.action;
      if(act==='showAddGuest'){ if(!requireAdmin())return; showGuestForm = true; render(); return; }
      if(act==='confirmAddGuest'){
        if(!requireAdmin())return;
        const input = document.getElementById('guestNameInput');
        const name = (input?.value||'').trim();
        if(name){ guestPlayers.push({name}); showGuestForm = false; render(); toast(`已新增外援:${name}`); }
        return;
      }
      if(act==='addBatter'){
        orderArrOf(el.dataset.ns).push({player:'',pos:''});
        render(); return;
      }
      if(act==='toggleLineup'){ lineupExpanded[el.dataset.ns] = !lineupExpanded[el.dataset.ns]; render(); return; }
      if(act==='toggleGameLog'){ gameLogExpanded = !gameLogExpanded; render(); return; }
      if(act==='toggleLineupEdit'){ lineupEditMode[el.dataset.ns] = !lineupEditMode[el.dataset.ns]; render(); return; }
      if(act==='toggleSubPanel'){ subPanelOpen[el.dataset.ns] = !subPanelOpen[el.dataset.ns]; render(); return; }
      if(act==='confirmSub'){
        const ns = el.dataset.ns;
        const idx = +el.dataset.idx;
        const playerSel = document.querySelector('[data-sub-player]');
        const posSel = document.querySelector('[data-sub-pos]');
        const arr = orderArrOf(ns);
        if(!playerSel || !playerSel.value){ toast('請選新上場的球員'); return; }
        arr[idx].player = playerSel.value;
        if(posSel) arr[idx].pos = posSel.value;
        subPanelOpen[ns] = false;
        if(navigator.vibrate) navigator.vibrate(15);
        render();
        toast('已換人');
        return;
      }
      if(act==='selectCupStage'){ selectedCupStage = el.dataset.stage || null; render(); return; }
      if(act==='planLineup'){
        if(!requireAdmin())return;
        planningScheduleIdx = +el.dataset.idx;
        currentView = 'lineupPlan';
        setActiveNav(); render();
        return;
      }
      if(act==='showCreateCup'){ if(!requireAdmin())return; showCupForm = true; render(); return; }
      if(act==='confirmCreateCup'){
        if(!requireAdmin())return;
        const input = document.getElementById('cupNameInput');
        const name = (input?.value||'').trim();
        if(name){ cupInfo = {name}; showCupForm = false; render(); toast(`已建立盃賽:${name}`); }
        return;
      }
      if(act==='deleteCup'){
        if(!requireAdmin())return;
        cupInfo = null; cupParticipants = []; cupBattingOrder = new Array(10).fill(null).map(()=>({player:'',pos:''})); cupFieldAssignment = {};
        render(); return;
      }
      if(act==='editStandings'){ if(!requireAdmin())return; editingStandings = !editingStandings; render(); return; }
      if(act==='saveStandings'){
        if(!requireAdmin())return;
        standings.forEach(r=>{
          const w = document.getElementById('sw-'+r.team), l = document.getElementById('sl-'+r.team), t = document.getElementById('st-'+r.team);
          if(w) r.w = +w.value||0;
          if(l) r.l = +l.value||0;
          if(t) r.t = +t.value||0;
          const g = r.w+r.l+r.t;
          r.pct = g ? (r.w/g).toFixed(3).replace(/^0/,'') : '.000';
        });
        standings.sort((a,b)=> (b.w-b.l) - (a.w-a.l));
        standings.forEach((r,i)=> r.rank = i+1);
        editingStandings = false; render(); flushCloudSaveNow(); toast('已更新戰績');
        return;
      }
      if(act==='addPlayer'){ if(!requireAdmin())return; showAddPlayerForm = true; render(); return; }
      if(act==='confirmAddPlayer'){
        if(!requireAdmin())return;
        const nm = document.getElementById('newPlayerName')?.value.trim();
        const no = document.getElementById('newPlayerNo')?.value.trim();
        const pos = document.getElementById('newPlayerPos')?.value.trim();
        if(!nm){ toast('請輸入姓名'); return; }
        roster.splice(roster.length-4, 0, {no: no||'-', name: nm, jersey:'', size:'', pos: pos||''});
        showAddPlayerForm = false; render(); toast(`已新增球員:${nm}`);
        return;
      }
      if(act==='saveEditPlayer'){
        if(!requireAdmin())return;
        const idx = +el.dataset.idx;
        const p = roster[idx];
        if(!p){ editingPlayerIdx = null; render(); return; }
        const oldName = p.name;
        const newName = document.getElementById('editName')?.value.trim() || p.name;
        p.name = newName;
        p.no = document.getElementById('editNo')?.value.trim() || p.no;
        p.jersey = document.getElementById('editJersey')?.value.trim() || '';
        p.size = document.getElementById('editSize')?.value.trim() || '';
        p.pos = document.getElementById('editPos')?.value.trim() || '';
        const st = document.getElementById('editStatus')?.value.trim();
        if(st) p.status = st; else delete p.status;
        const num = id => { const v = +document.getElementById(id)?.value; return isNaN(v) ? 0 : v; };
        if(oldName !== newName){ delete battingStats[oldName]; delete pitchingStats[oldName]; }
        battingStats[newName] = { AB:num('editAB'), H:num('editH'), HR:num('editHR'), BB:num('editBBb'), R:num('editBatR'), outs:0, K:0, ER:0, W:0 };
        pitchingStats[newName] = { outs:num('editOuts'), K:num('editK'), H:num('editPH'), BB:num('editPBB'), R:num('editPR'), ER:num('editER'), W:num('editW') };
        editingPlayerIdx = null; render(); flushCloudSaveNow(); toast('已更新球員資料');
        return;
      }
      if(act==='cancelEditPlayer'){ editingPlayerIdx = null; render(); return; }
      if(act==='addSchedule'){
        if(!requireAdmin())return;
        const type = document.getElementById('schedType').value;
        const stage = type==='盃賽' ? document.getElementById('schedStage').value : '';
        const oppSel = document.getElementById('schedOppSel').value;
        const opp = oppSel==='__new__' ? document.getElementById('schedOppNew').value.trim() : oppSel;
        const date = document.getElementById('schedDate').value;
        const time = document.getElementById('schedTime').value;
        const placeSel = document.getElementById('schedPlaceSel').value;
        const place = placeSel==='__new__' ? document.getElementById('schedPlaceNew').value.trim() : placeSel;
        if(!opp){ toast('請選擇或輸入對手球隊'); return; }
        schedule.push({type, opp, date, time, place, stage});
        sortSchedule();
        render();
        flushCloudSaveNow();
        toast('已新增賽程');
        return;
      }
      if(act==='startGame'){
        const ns = el.dataset.ns;
        const selEl = document.getElementById('startGameSel');
        const oppInput = document.getElementById('startOpp');
        let opp, scheduleIdx = null;
        if(selEl && selEl.value!==''){
          scheduleIdx = +selEl.value;
          opp = schedule[scheduleIdx]?.opp;
        }
        if(!opp) opp = (oppInput?.value||'').trim();
        if(!opp){ toast('請選一場比賽或輸入對手球隊'); return; }
        liveGame[ns] = newLiveState(opp, pendingBatFirst[ns], scheduleIdx);
        const sched = scheduleIdx!=null ? schedule[scheduleIdx] : null;
        if(sched && sched.plannedLineup && sched.plannedLineup.some(r=>r.player)){
          const target = orderArrOf(ns);
          target.length = 0;
          sched.plannedLineup.forEach(r=> target.push({player:r.player||'', pos:r.pos||''}));
          toast('比賽開始,已帶入預排打序!');
        } else {
          toast('比賽開始,加油!');
        }
        liveGame[ns].startingLineup = orderArrOf(ns).map(r=>({player:r.player, pos:r.pos}));
        pendingGameChoice[ns] = {sel:'', opp:''};
        render();
        return;
      }
      if(act==='undo'){ undoLast(el.dataset.ns); return; }
      if(act==='endGame'){ endGame(el.dataset.ns); return; }
      if(act==='oppRun'){ recordOppRun(el.dataset.ns); return; }
      if(act==='saveSettings'){
        if(!requireAdmin())return;
        const league = document.getElementById('settingLeague')?.value.trim();
        const games = +document.getElementById('settingTotalGames')?.value;
        if(league){ leagueName = league; document.querySelector('.team-sub').textContent = `2026 賽季 · ${leagueName}`; }
        if(games) totalGames = games;
        render();
        flushCloudSaveNow();
        toast('已儲存賽季設定');
        return;
      }
      if(act==='savePreseason'){
        if(!requireAdmin())return;
        const pg = +document.getElementById('settingPreGames')?.value;
        preseasonGamesPlayed = isNaN(pg) ? 0 : Math.max(0,pg);
        const st = document.getElementById('settingPreStreakType')?.value;
        const sc = +document.getElementById('settingPreStreakCount')?.value;
        preseasonStreak = st ? { type: st, count: isNaN(sc)?0:Math.max(0,sc) } : { type:null, count:0 };
        render();
        flushCloudSaveNow();
        toast('已儲存起始基準值');
        return;
      }
      if(act==='saveLinkedPlayer'){ saveLinkedPlayer(); return; }
      if(act==='resetStats'){
        if(!requireAdmin())return;
        if(!confirm('確定要把所有球員的打擊/投手數據清空嗎?這個動作沒辦法復原。')) return;
        Object.keys(battingStats).forEach(k=>delete battingStats[k]);
        Object.keys(pitchingStats).forEach(k=>delete pitchingStats[k]);
        render();
        flushCloudSaveNow();
        toast('已清空所有打擊/投手數據');
        return;
      }
      if(act==='refreshMembers'){ refreshMembers(); return; }
      if(act==='deleteGameRecord'){
        if(!requireAdmin())return;
        if(!confirm('確定要刪除這場比賽紀錄嗎?打擊/投手數據會一起消失,沒辦法復原。')) return;
        const id = el.dataset.id;
        const idx = gameHistory.findIndex(r=>r.id===id);
        if(idx>=0) gameHistory.splice(idx,1);
        const sched = schedule.find(s=>s.historyId===id);
        if(sched){ delete sched.historyId; delete sched.result; }
        currentView = 'schedule';
        setActiveNav(); render();
        flushCloudSaveNow();
        toast('已刪除這場紀錄');
        return;
      }
      if(act==='toggleRole'){ toggleMemberRole(el.dataset.id, el.dataset.role); return; }
      if(act==='addAccount'){ toast('這台裝置僅支援單一本機帳號,多人共用需接上第 6 點的雲端同步'); return; }
      if(act==='logout'){ doLogout(); return; }
      if(act==='doLogin'){ doLogin(); return; }
      if(act==='doSignup'){ doSignup(); return; }
      if(act==='toggleAuthView'){ authView = authView==='login'?'signup':'login'; authError=''; render(); return; }
      toast('架構示意 — 尚未串接功能');
    });
  });
}

function setActiveNav(){
  document.querySelectorAll('#bottomNav button').forEach(b=>{
    b.classList.toggle('active',
      b.dataset.view===currentView ||
      (currentView==='record' && b.dataset.view==='home') ||
      (currentView==='gameDetail' && b.dataset.view==='schedule') ||
      (currentView==='lineupPlan' && b.dataset.view==='schedule'));
  });
}

document.getElementById('bottomNav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('#bottomNav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
  window.scrollTo(0,0);
  if(currentView==='settings' && isAdmin() && !allProfiles.length) refreshMembers();
});

initSync();
initAuth();
</script>
</body>
</html>
